<script>
function slug(s){
  return s.toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g,'').trim().replace(/[\s_-]+/g,'-').replace(/^-+|-+$/g,'');
}
function run(){
  document.getElementById('out').textContent=slug(document.getElementById('in').value)||'鈥?;
}
run();
document.getElementById('in').addEventListener('input',run);
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    var s=q.get('text')||'';
    document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify({slug:slug(s)},null,2)+'</pre>';
  }
})();
</script>
