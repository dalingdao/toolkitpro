<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>营销文案评分器 - 标题/描述吸引力量化</title>
<meta name="description" content="电商运营/营销写文案场景：量化标题与描述的吸引力（长度/关键词/情感/行动号召），给改进建议。">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0f1117;color:#e5e7eb;min-height:100vh;padding:24px}
.wrap{max-width:760px;margin:0 auto}h1{font-size:24px;margin-bottom:6px}h2{font-size:15px;color:#9ca3af;font-weight:400;margin-bottom:20px}
.card{background:#171a23;border:1px solid #2a2e3a;border-radius:12px;padding:20px;margin-bottom:16px}
label{display:block;font-size:13px;color:#9ca3af;margin-bottom:4px}input,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #2a2e3a;background:#0f1117;color:#e5e7eb;font-size:14px}
textarea{min-height:80px;resize:vertical}select{width:200px;padding:10px;border-radius:8px;border:1px solid #2a2e3a;background:#0f1117;color:#e5e7eb;font-size:14px}
button{width:100%;padding:12px;background:#2563eb;border:none;color:#fff;border-radius:8px;font-size:15px;cursor:pointer;margin-top:14px}
.out{background:#0b0d12;border:1px solid #2a2e3a;border-radius:8px;padding:14px;margin-top:12px;font-size:14px;line-height:1.7}
.tag{display:inline-block;background:#1e293b;color:#60a5fa;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
.score{font-size:42px;font-weight:700}.gA{color:#34d399}.gB{color:#a3e635}.gC{color:#fbbf24}.gD{color:#f87171}
.bar{height:8px;background:#1e293b;border-radius:4px;margin:4px 0 8px}.bar i{display:block;height:8px;border-radius:4px;background:#2563eb}
</style>
</head>
<body>
<div class="wrap">
<h1>营销文案评分器 <span class="tag">原创 · 电商/营销场景</span></h1>
<h2>标题/描述吸引力量化：长度·关键词·情感·行动号召 → 评分+改进建议</h2>
<div class="card">
<label>标题</label><input id="title" placeholder="例：新品无线耳机 限时立减100 超长续航" value="新品无线耳机 限时立减100 超长续航">
<label>描述（可选）</label><textarea id="desc" placeholder="例：主动降噪，续航40小时，下单送保护壳"></textarea>
<label>平台</label><select id="platform"><option value="ecommerce">电商</option><option value="social">社媒</option><option value="email">邮件</option></select>
<button onclick="run()">评分</button>
<div class="out" id="out">输入标题后评分。</div>
</div>
<div style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:16px;margin:16px auto;font-size:13px;line-height:1.7;color:#cbd5e1"><b style="color:#60a5fa">💡 实用场景：</b>电商运营/营销写标题与描述时，快速判断吸引力并得到改进建议。<br><b style="color:#60a5fa">示例：</b>标题「新品无线耳机 限时立减100 超长续航」+ 描述 → 评分+各项分析+建议</div>
</div>
<script>
function compute(title,desc,platform){
  const t=(title||'').trim();const d=(desc||'').trim();
  if(!t)throw new Error('title required');
  const len=t.length;
  const ranges={ecommerce:[10,30],social:[5,15],email:[15,40]};
  const r=ranges[platform]||ranges.ecommerce;
  let lenScore=100;
  if(len<r[0])lenScore=Math.max(0,100-(r[0]-len)*8);
  else if(len>r[1])lenScore=Math.max(0,100-(len-r[1])*4);
  const kw=(t.match(/[\u4e00-\u9fff]{2,}|[A-Za-z]{3,}|[0-9]+/g)||[]).filter(x=>x.length>=2);
  const kwScore=Math.min(100,kw.length*15+20);
  const emo=(t+d).match(/超值|新品|爆款|限时|免费|省|划算|独家|升级|热销|全新|惊喜|优惠|立减|赠送/g)||[];
  const emoScore=Math.min(100,40+emo.length*15);
  const cta=(t+d).match(/立即|点击|下单|咨询|了解|购买|加入|领取|抢购|预约|购买/g)||[];
  const ctaScore=Math.min(100,30+cta.length*20);
  const score=Math.round(lenScore*0.3+kwScore*0.25+emoScore*0.2+ctaScore*0.25);
  const sugg=[];
  if(lenScore<70)sugg.push('标题长度建议'+r[0]+'-'+r[1]+'字（当前'+len+'字）');
  if(kwScore<70)sugg.push('加入具体关键词（品牌/品类/数字/卖点）');
  if(emoScore<70)sugg.push('加入情感触发词（超值/新品/限时/立减）');
  if(ctaScore<70)sugg.push('加入行动号召（立即/下单/咨询/领取）');
  return {score,grade:score>=85?'A':score>=70?'B':score>=50?'C':'D',lenScore,kwScore,emoScore,ctaScore,length:len,suggestions:sugg,platform};
}
function run(){
  try{
    const r=compute(document.getElementById('title').value,document.getElementById('desc').value,document.getElementById('platform').value);
    const gc={A:'gA',B:'gB',C:'gC',D:'gD'}[r.grade];
    document.getElementById('out').innerHTML=`<div class="score ${gc}">${r.score}<span style="font-size:14px;color:#9ca3af"> /100 · ${r.grade}</span></div>
<div>长度 <b>${r.lenScore}</b></div><div class="bar"><i style="width:${r.lenScore}%"></i></div>
<div>关键词 <b>${r.kwScore}</b></div><div class="bar"><i style="width:${r.kwScore}%"></i></div>
<div>情感 <b>${r.emoScore}</b></div><div class="bar"><i style="width:${r.emoScore}%"></i></div>
<div>行动号召 <b>${r.ctaScore}</b></div><div class="bar"><i style="width:${r.ctaScore}%"></i></div>
${r.suggestions.length?'<div style="margin-top:8px;color:#fbbf24">改进建议：</div>'+r.suggestions.map(s=>'· '+s).join('<br>'):'<div style="color:#34d399;margin-top:8px">✓ 无明显短板</div>'}`;
    window._last={tool:'marketing-score',input:{title:document.getElementById('title').value,desc:document.getElementById('desc').value,platform:r.platform},output:r};
  }catch(e){document.getElementById('out').innerHTML=e.message}
}
(function(){const u=new URL(location.href);if(u.searchParams.get('format')==='json'){try{const d=JSON.parse(u.searchParams.get('input')||'{}');const r=compute(d.title,d.desc||'',d.platform||'ecommerce');document.body.textContent=JSON.stringify({tool:'marketing-score',input:d,output:r})}catch(e){document.body.textContent=JSON.stringify({tool:'marketing-score',error:e.message})}}})();
</script>
<script data-goatcounter="https://dalingdao.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
