<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}
.header{text-align:center;padding:36px 20px 24px}
.header h1{font-size:28px;font-weight:800;color:#0f172a;margin-bottom:8px}
.header p{color:#64748b;font-size:14px;max-width:640px;margin:0 auto}
.badges{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}

.field{margin-bottom:14px}

input{width:100%;padding:11px;border-radius:8px;border:1px solid #cbd5e1;font-size:15px}
.result{margin-top:16px;background:#eff6ff;border-radius:12px;padding:24px;text-align:center}

.result .sub{font-size:14px;color:#475569;margin-top:10px;line-height:1.8}
.back{display:inline-block;margin:20px;font-size:13px;color:#64748b;text-decoration:none}

</head>
<body>
<a class="back" href="/toolkitpro/">鈫?杩斿洖宸ュ叿绠?/a>

<script>
function calc(){
  var a=+document.getElementById('a').value||0,r=+document.getElementById('r').value||0,n=+document.getElementById('n').value||1;
  var el=document.getElementById('res');
  var i=r/100;
  var pv=a*(1-Math.pow(1+i,-n))/i;
  var fv=a*(Math.pow(1+i,n)-1)/i;
  el.innerHTML='<div class="big">楼'+pv.toLocaleString('zh-CN',{maximumFractionDigits:0})+'</div><div class="sub">骞撮噾鐜板€?PV<br>骞撮噾缁堝€?FV 楼'+fv.toLocaleString('zh-CN',{maximumFractionDigits:0})+'<br>鎬绘姇鍏?楼'+(a*n).toLocaleString('zh-CN',{maximumFractionDigits:0})+'</div>';
}
calc();
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    var a=+q.get('payment')||0,r=+q.get('rate')||0,n=+q.get('periods')||1,i=r/100;
    document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify({present_value:a*(1-Math.pow(1+i,-n))/i,future_value:a*(Math.pow(1+i,n)-1)/i},null,2)+'</pre>';

})();
</script>
