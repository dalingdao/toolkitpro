<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Forge - 配色方案生成器</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--acc:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
header{text-align:center;margin-bottom:24px}
header h1{font-size:26px;color:var(--acc)}
header p{color:var(--muted);font-size:13px;margin-top:4px}
.controls{max-width:900px;margin:0 auto 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.controls label{font-size:13px;color:var(--muted)}
.controls select,.controls input[type=color],.controls button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
.controls button{background:var(--acc);border:none;color:#0f172a;font-weight:600}
.controls button:hover{filter:brightness(1.1)}
.palette-grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:600px){.palette-grid{grid-template-columns:repeat(2,1fr)}}
.color-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s}
.color-card:hover{transform:translateY(-4px)}
.color-swatch{height:120px;position:relative}
.color-swatch .lock{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.color-info{padding:10px;text-align:center}
.color-info .hex{font-family:monospace;font-size:15px;font-weight:600}
.color-info .name{font-size:11px;color:var(--muted);margin-top:2px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--acc);color:#0f172a;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.history{max-width:900px;margin:24px auto 0}
.history h3{font-size:14px;color:var(--muted);margin-bottom:8px}
.history-items{display:flex;gap:4px;flex-wrap:wrap}
.history-item{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);cursor:pointer}
</style>
</head>
<body>
<header><h1>🎨 Color Forge</h1><p>配色方案生成器 · 按空格键随机生成 · 点击复制HEX · 纯前端</p></header>
<div class="controls">
  <label>模式</label>
  <select id="mode" onchange="generate()">
    <option value="random">随机</option>
    <option value="analogous">类似色</option>
    <option value="complementary">互补色</option>
    <option value="triadic">三角色</option>
    <option value="monochrome">单色</option>
    <option value="warm">暖色调</option>
    <option value="cool">冷色调</option>
  </select>
  <label>基准色</label>
  <input type="color" id="baseColor" value="#3b82f6" onchange="generate()">
  <button onclick="generate()">🎲 生成</button>
  <button onclick="exportPalette()" style="background:var(--border)">📋 导出JSON</button>
</div>
<div class="palette-grid" id="palette"></div>
<div class="history">
  <h3>历史记录</h3>
  <div class="history-items" id="history"></div>
</div>
<div class="toast" id="toast">已复制!</div>
<script>
let palette=[];
let locked=new Array(5).fill(false);
let history=[];

function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,'0');};return'#'+f(0)+f(8)+f(4);}
function hexToHsl(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];}

function generateColor(i){
  const mode=document.getElementById('mode').value;
  const base=hexToHsl(document.getElementById('baseColor').value);
  const bh=base[0];
  switch(mode){
    case'random':return[Math.round(Math.random()*360),40+Math.random()*40,35+Math.random()*40];
    case'analogous':{const off=(i-2)*30;return[(bh+off+360)%360,60+Math.random()*20,40+Math.random()*20];}
    case'complementary':{const h=i<3?bh:(bh+180)%360;return[h,50+Math.random()*30,35+i*8];}
    case'triadic':{const offsets=[0,120,240,0,120];return[(bh+offsets[i]+360)%360,55+Math.random()*20,40+Math.random()*20];}
    case'monochrome':{return[bh,40+Math.random()*30,20+i*15];}
    case'warm':{const range=[0,30,60,330,350];return[range[i]+Math.random()*15,60+Math.random()*30,40+Math.random()*20];}
    case'cool':{const range=[180,200,220,240,270];return[range[i]+Math.random()*15,50+Math.random()*30,40+Math.random()*20];}
  }
  return[Math.random()*360,50,50];
}

function generate(){
  const newColors=[];
  for(let i=0;i<5;i++){
    if(locked[i]&&palette[i]){newColors.push(palette[i]);}
    else{const[h,s,l]=generateColor(i);newColors.push({hex:hslToHex(h,s,l),h,s,l});}
  }
  palette=newColors;
  render();
}

function getColorName(h,s,l){
  if(l<15)return'Near Black';if(l>90)return'Near White';if(s<10)return'Gray';
  const names=[[0,'Red'],[15,'Vermilion'],[30,'Orange'],[45,'Amber'],[60,'Yellow'],[75,'Lime'],[90,'Chartreuse'],[120,'Green'],[150,'Spring'],[180,'Cyan'],[200,'Azure'],[220,'Blue'],[250,'Indigo'],[270,'Violet'],[290,'Purple'],[315,'Magenta'],[340,'Rose'],[360,'Red']];
  let name='Red';
  for(const[deg,n]of names){if(h>=deg)name=n;}
  return name;
}

function render(){
  const grid=document.getElementById('palette');
  grid.innerHTML=palette.map((c,i)=>`
    <div class="color-card" onclick="copyHex(${i})">
      <div class="color-swatch" style="background:${c.hex}">
        <button class="lock" onclick="event.stopPropagation();toggleLock(${i})">${locked[i]?'🔒':'🔓'}</button>
      </div>
      <div class="color-info">
        <div class="hex">${c.hex.toUpperCase()}</div>
        <div class="name">${getColorName(c.h,c.s,c.l)} · H${c.h} S${c.s}% L${c.l}%</div>
      </div>
    </div>`).join('');
}

function copyHex(i){
  const hex=palette[i].hex.toUpperCase();
  navigator.clipboard.writeText(hex).then(()=>{
    showToast('已复制 '+hex);
    addHistory(hex);
  }).catch(()=>{showToast('复制失败');});
}

function toggleLock(i){locked[i]=!locked[i];render();}

function addHistory(hex){
  history.unshift(hex);
  if(history.length>20)history.pop();
  const el=document.getElementById('history');
  el.innerHTML=history.map(h=>`<div class="history-item" style="background:${h}" title="${h}" onclick="copyText('${h}')"></div>`).join('');
}

function copyText(t){navigator.clipboard.writeText(t).then(()=>showToast('已复制 '+t));}

function exportPalette(){
  const data=palette.map(c=>({hex:c.hex.toUpperCase(),hsl:`hsl(${c.h},${c.s}%,${c.l}%)`}));
  const json=JSON.stringify(data,null,2);
  navigator.clipboard.writeText(json).then(()=>showToast('JSON已复制到剪贴板'));
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1500);
}

document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.matches('input,select,textarea')){e.preventDefault();generate();}});

generate();
</script>
</body>
</html>
