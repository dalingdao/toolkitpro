<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer - 免费在线番茄钟</title>
<meta name="description" content="免费在线番茄钟计时器，25分钟专注/5分钟休息循环，纯前端，无需注册。">
<meta name="keywords" content="番茄钟,pomodoro,专注,计时器,25分钟,免费工具">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{text-align:center;padding:36px 20px 24px}
.header h1{font-size:28px;font-weight:800;margin-bottom:8px}
.header p{color:#94a3b8;font-size:14px}
.badges{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#1e293b;color:#60a5fa}
.ring{position:relative;width:260px;height:260px;margin:20px auto}
.ring svg{transform:rotate(-90deg)}
.ring .txt{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
.ring .txt .time{font-size:52px;font-weight:800}
.ring .txt .mode{color:#94a3b8;font-size:14px;margin-top:4px}
.seg{display:flex;gap:8px;margin-bottom:20px}
.seg button{padding:10px 18px;border-radius:20px;border:1px solid #334155;background:#1e293b;cursor:pointer;font-size:14px;color:#fff}
.seg button.on{background:#2563eb;border-color:#2563eb}
.ctrl{display:flex;gap:12px}
.ctrl button{padding:12px 28px;border-radius:24px;border:none;cursor:pointer;font-size:16px;font-weight:600;background:#2563eb;color:#fff}
.ctrl button.sec{background:#334155}
.back{display:inline-block;margin:20px;font-size:13px;color:#64748b;text-decoration:none}
</style>
</head>
<body>
<a class="back" href="/toolkitpro/">← 返回工具箱</a>
<div class="header">
  <h1>🍅 Pomodoro</h1>
  <p>25分钟专注 / 5分钟休息循环。</p>
  <div class="badges"><span class="badge">纯前端</span><span class="badge">专注</span><span class="badge">25分钟</span></div>
</div>
<div class="ring">
  <svg width="260" height="260"><circle cx="130" cy="130" r="118" stroke="#1e293b" stroke-width="10" fill="none"/><circle id="prog" cx="130" cy="130" r="118" stroke="#2563eb" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="741" stroke-dashoffset="0"/></svg>
  <div class="txt"><div class="time" id="time">25:00</div><div class="mode" id="mode">专注</div></div>
</div>
<div class="seg">
  <button id="s1" class="on" onclick="setMode(1)">专注 25</button>
  <button id="s2" onclick="setMode(2)">短休 5</button>
  <button id="s3" onclick="setMode(3)">长休 15</button>
</div>
<div class="ctrl">
  <button id="start" onclick="start()">开始</button>
  <button class="sec" onclick="reset()">重置</button>
</div>
<script>
var MODES={1:25*60,2:5*60,3:15*60},mode=1,left=MODES[1],running=false,iv=null;
function setMode(m){mode=m;left=MODES[m];stop();document.getElementById('s1').className=m===1?'on':'';document.getElementById('s2').className=m===2?'on':'';document.getElementById('s3').className=m===3?'on':'';draw();}
function draw(){var m=Math.floor(left/60),s=left%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');document.getElementById('mode').textContent=mode===1?'专注':mode===2?'短休':'长休';document.getElementById('prog').setAttribute('stroke-dashoffset',741*(1-left/MODES[mode]));}
function start(){if(running){stop();document.getElementById('start').textContent='开始';return;}running=true;document.getElementById('start').textContent='暂停';iv=setInterval(function(){left--;if(left<=0){left=0;stop();document.getElementById('start').textContent='开始';}draw();},1000);}
function stop(){running=false;clearInterval(iv);}
function reset(){stop();left=MODES[mode];document.getElementById('start').textContent='开始';draw();}
draw();
</script>
</body>
</html>
