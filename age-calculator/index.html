<script>
function calc(){

  if(m<0){y--;m+=12;}
  var totalD=Math.floor((n-b)/86400000);
  var xusui=y+1;
  var nb=new Date(n.getFullYear(),b.getMonth(),b.getDate());
  if(nb<n)nb=new Date(n.getFullYear()+1,b.getMonth(),b.getDate());

}
