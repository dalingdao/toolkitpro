<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字进制转换器 - Base Converter - 在线工具</title>
<meta name="description" content="免费在线数字进制转换工具。二进制、八进制、十进制、十六进制互转，任意进制 2-36，即时转换。">
<meta name="keywords" content="进制转换, Base Converter, 二进制转十进制, 十六进制, 在线工具">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #eef1f6 100%); min-height: 100vh; padding: 40px 20px; color: #2d3748; }
.container { max-width: 860px; margin: 0 auto; }
h1 { text-align: center; font-size: 28px; margin-bottom: 10px; color: #1a202c; }
.sub { text-align: center; color: #718096; margin-bottom: 30px; font-size: 14px; }
.toolbox { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
label { font-size: 13px; color: #718096; display: block; margin-bottom: 8px; font-weight: 600; }
input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; font-family: 'SF Mono', Consolas, monospace; }
input:focus { outline: none; border-color: #ed64a6; }
.bases { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 16px; }
.base { background: #f7fafc; border-radius: 10px; padding: 14px; border: 2px solid #e2e8f0; }
.base .lbl { font-size: 12px; color: #718096; font-weight: 600; margin-bottom: 6px; }
.base .val { font-size: 16px; font-family: 'SF Mono', Consolas, monospace; color: #2d3748; word-break: break-all; }
.ctrl { display: flex; gap: 10px; margin: 16px 0; align-items: center; }
.ctrl select { padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
footer { text-align: center; margin-top: 30px; color: #a0aec0; font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <h1>数字进制转换器</h1>
  <p class="sub">Base Converter - 二/八/十/十六进制互转</p>
  <div class="toolbox">
    <div class="ctrl">
      <label>输入数字</label>
      <input id="num" placeholder="255" value="255" style="flex:1">
      <select id="from">
        <option value="2">二进制</option><option value="8">八进制</option>
        <option value="10" selected>十进制</option><option value="16">十六进制</option>
      </select>
    </div>
    <div class="bases">
      <div class="base"><div class="lbl">二进制 (Base 2)</div><div class="val" id="b2">11111111</div></div>
      <div class="base"><div class="lbl">八进制 (Base 8)</div><div class="val" id="b8">377</div></div>
      <div class="base"><div class="lbl">十进制 (Base 10)</div><div class="val" id="b10">255</div></div>
      <div class="base"><div class="lbl">十六进制 (Base 16)</div><div class="val" id="b16">ff</div></div>
    </div>
  </div>
  <footer>© 2026 ToolkitPro - 免费在线工具集</footer>
</div>
<script>
function convert() {
  const s = document.getElementById('num').value.trim();
  const from = parseInt(document.getElementById('from').value);
  if (!s) { ['b2','b8','b10','b16'].forEach(id => document.getElementById(id).textContent = '—'); return; }
  try {
    const n = parseInt(s, from);
    if (isNaN(n)) throw new Error('invalid');
    document.getElementById('b2').textContent = n.toString(2);
    document.getElementById('b8').textContent = n.toString(8);
    document.getElementById('b10').textContent = n.toString(10);
    document.getElementById('b16').textContent = n.toString(16);
  } catch (e) { ['b2','b8','b10','b16'].forEach(id => document.getElementById(id).textContent = '无效输入'); }
}
document.getElementById('num').addEventListener('input', convert);
document.getElementById('from').addEventListener('change', convert);
convert();
</script>
</body>
</html>
