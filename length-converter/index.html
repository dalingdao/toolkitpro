<style>

<body>

</div>
<div class="container">
  <div class="card">
    <div class="field"><label>鏁板€?/label><input type="number" id="v" value="1" min="0" oninput="calc()"></div>
    <div class="field"><label>鍗曚綅</label><select id="u" onchange="calc()">
      <option value="m" selected>绫?m</option><option value="cm">鍘樼背 cm</option><option value="mm">姣背 mm</option><option value="km">鍗冪背 km</option><option value="in">鑻卞 in</option><option value="ft">鑻卞昂 ft</option>

<script>
var R={m:1,cm:100,mm:1000,km:0.001,in:39.3701,ft:3.28084};
function calc(){
  var v=+document.getElementById('v').value||0,u=document.getElementById('u').value;
  var m=v/R[u];
  var rows=Object.keys(R).map(function(k){return '<div class="row"><span>'+k+'</span><b>'+(m*R[k]).toLocaleString('en-US',{maximumFractionDigits:6})+'</b></div>';}).join('');
  document.getElementById('res').innerHTML=rows;
}
calc();
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    var v=+q.get('value')||0,u=q.get('unit')||'m',m=v/R[u],out={m:m};
    Object.keys(R).forEach(function(k){out[k]=m*R[k];});
    document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify(out,null,2)+'</pre>';
  }
})();
</script>
