<script>
var R={s:1,min:60,h:3600,d:86400,w:604800,y:31536000};
function calc(){
  var v=+document.getElementById('v').value||0,u=document.getElementById('u').value;
  var s=v/R[u];
  var rows=Object.keys(R).map(function(k){return '<div class="row"><span>'+k+'</span><b>'+(s*R[k]).toLocaleString('en-US',{maximumFractionDigits:6})+'</b></div>';}).join('');
  document.getElementById('res').innerHTML=rows;
}
calc();
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    var v=+q.get('value')||0,u=q.get('unit')||'s',s=v/R[u],out={s:s};
    Object.keys(R).forEach(function(k){out[k]=s*R[k];});
    document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify(out,null,2)+'</pre>';
  }
})();
</script>
