<body>
<div class="wrap">
<h1>🎨 FPS 游戏概念图 · 城市寻女</h1>
<div class="sub">精致概念设计稿 · 6 张（玩法流程/场景布局/角色/武器/UI/敌人）· 渐变+光影+图标</div>

<div class="notes"><b>设计要点：</b>玩家持突击步枪在入侵城市寻找失散的女儿。核心循环：<b>移动→射击→拾取→找女儿→营救</b>。靠近女儿(3m)营救获胜；被击倒失败。</div>

<div class="sheet"><h2><span class="tag">概念图 1</span>玩法流程</h2><div class="meta">GAME FLOW</div><canvas id="c1" width="1000" height="260"></canvas></div>
<div class="sheet"><h2><span class="tag">概念图 2</span>场景布局（俯视）</h2><div class="meta">CITY MAP</div><canvas id="c2" width="1000" height="540"></canvas></div>
<div class="sheet"><h2><span class="tag">概念图 3</span>玩家角色</h2><div class="meta">PLAYER</div><canvas id="c3" width="1000" height="400"></canvas></div>
<div class="sheet"><h2><span class="tag">概念图 4</span>突击步枪</h2><div class="meta">ASSAULT RIFLE</div><canvas id="c4" width="1000" height="260"></canvas></div>
<div class="sheet"><h2><span class="tag">概念图 5</span>UI 布局</h2><div class="meta">HUD</div><canvas id="c5" width="1000" height="320"></canvas></div>
<div class="sheet"><h2><span class="tag">概念图 6</span>入侵者设计</h2><div class="meta">ENEMIES</div><canvas id="c6" width="1000" height="300"></canvas></div>
</div>

<script>
// ===== 精致概念图工具（Canvas 2D：渐变/阴影/光效/圆角）=====
const C={bg:'#0c0f1a',line:'#aab',grid:'rgba(120,140,200,.08)',grid2:'rgba(120,140,200,.16)'};
function paper(x,w,h){x.clearRect(0,0,w,h);
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0d1020');g.addColorStop(1,'#0a0c16');x.fillStyle=g;x.fillRect(0,0,w,h);
  for(let i=0;i<w;i+=40){x.strokeStyle=C.grid;x.lineWidth=1;x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();}
  for(let i=0;i<h;i+=40){x.strokeStyle=C.grid;x.lineWidth=1;x.beginPath();x.moveTo(0,i);x.lineTo(w,i);x.stroke();}
  for(let i=0;i<w;i+=200){x.strokeStyle=C.grid2;x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();}
  for(let i=0;i<h;i+=200){x.strokeStyle=C.grid2;x.beginPath();x.moveTo(0,i);x.lineTo(w,i);x.stroke();}
}
function rr(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
function box(x,px,py,w,h,r,c1,c2,glow){x.save();x.shadowColor=glow||'rgba(0,0,0,.5)';x.shadowBlur=14;x.shadowOffsetY=4;
  const g=x.createLinearGradient(px,py,px,py+h);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;rr(x,px,py,w,h,r);x.fill();x.restore();
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=1;rr(x,px,py,w,h,r);x.stroke();}
function glow(x,px,py,r,color,alpha){const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,color.replace('A',alpha||0.7));g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();}
function txt(x,s,px,py,size,c,align,weight){x.fillStyle=c||'#e5e7eb';x.font=(weight||'bold')+' '+(size||14)+'px system-ui,Segoe UI';x.textAlign=align||'left';x.fillText(s,px,py);}
function arrow(x,x1,y1,x2,y2,c){const g=x.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,'rgba(139,92,246,.6)');g.addColorStop(1,'rgba(139,92,246,.2)');x.strokeStyle=c||'rgba(167,139,250,.7)';x.lineWidth=2.5;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
  const a=Math.atan2(y2-y1,x2-x1);x.fillStyle=c||'rgba(167,139,250,.9)';x.beginPath();x.moveTo(x2,y2);x.lineTo(x2-11*Math.cos(a-0.4),y2-11*Math.sin(a-0.4));x.lineTo(x2-11*Math.cos(a+0.4),y2-11*Math.sin(a+0.4));x.fill();}

// ==== 1 玩法流程 ====
(function(){const c=document.getElementById('c1'),x=c.getContext('2d');paper(x,1000,260);
  const nodes=[['🚀','开始营救',90],['🗺️','移动探索',235],['🔫','射击入侵者',380],['🎒','拾取道具',525],['👧','靠近女儿',670],['🎉','营救成功',815]];
  nodes.forEach((n,i)=>{const py=100;x.save();x.shadowColor='rgba(139,92,246,.6)';x.shadowBlur=i===5?22:14;x.shadowOffsetY=4;
    box(x,n[2]-45,py,90,62,14,i===5?'#16a34a':'#1e1b4b',i===5?'#0f766e':'#111327',i===5?'rgba(22,163,74,.4)':'rgba(139,92,246,.3)');
    x.restore();txt(x,n[1],n[2],py+28,22,'#fff','center');txt(x,n[0],n[2],py+48,13,'#c4b5fd','center',false);
    if(i<nodes.length-1)arrow(x,n[2]+48,131,nodes[i+1][2]-48,131);});
  txt(x,'被击倒 → 失败',500,50,13,'#f87171','center');arrow(x,500,66,500,96,'rgba(248,113,113,.6)');
  txt(x,'循环',500,242,11,'#6b7280','center',false);
})();

// ==== 2 场景布局 ====
(function(){const c=document.getElementById('c2'),x=c.getContext('2d');paper(x,1000,540);
  // 地图底
  box(x,80,60,840,420,18,'#11141f','#0d1017','rgba(0,0,0,.5)');
  txt(x,'城市边界 · 60×60m',500,52,14,'#c4b5fd','center');
  // 街道（十字）
  x.fillStyle='rgba(90,110,160,.15)';x.fillRect(80,250,840,40);x.fillRect(350,60,40,420);x.fillRect(590,60,40,420);
  txt(x,'街道',395,278,11,'#6b7280','center',false);
  // 建筑（渐变+窗户）
  const builds=[[150,140],[530,150],[150,360],[530,360],[340,270],[175,300,80,50],[540,300,80,50],[110,270,50,100],[700,270,50,100]];
  builds.forEach((b,i)=>{const w=b[2]||90,h=b[3]||90;x.save();x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=12;x.shadowOffsetY=3;
    const g=x.createLinearGradient(b[0],b[1],b[0]+w,b[1]+h);g.addColorStop(0,'#2a2f45');g.addColorStop(1,'#1a1e30');x.fillStyle=g;x.fillRect(b[0],b[1],w,h);x.restore();
    x.strokeStyle='rgba(255,255,255,.1)';x.strokeRect(b[0],b[1],w,h);
    x.fillStyle='rgba(250,220,120,.7)';for(let wy=b[1]+14;wy<b[1]+h-10;wy+=22)for(let wx=b[0]+12;wx<b[0]+w-8;wx+=22)x.fillRect(wx,wy,8,10);});
  // 出生点
  glow(x,190,230,40,'rgba(239,68,68,A)');box(x,176,216,28,28,8,'#ef4444','#b91c1c','rgba(239,68,68,.4)');txt(x,'▲',190,236,14,'#fff','center');txt(x,'出生点',190,206,12,'#f87171','center');
  // 女儿（光柱）
  const dx=170,dy=430;glow(x,dx,dy,46,'rgba(34,197,94,A)');x.fillStyle='rgba(34,197,94,.25)';x.fillRect(dx-3,dy-70,6,70);
  box(x,dx-13,dy-13,26,26,8,'#22c55e','#15803d','rgba(34,197,94,.5)');txt(x,'👧',dx,dy+6,14,'#fff','center');
  txt(x,'女儿·小霓',dx,dy+40,12,'#4ade80','center');
  arrow(x,190,230,dx,dy,'rgba(74,222,128,.5)');txt(x,'营救路线 ~30m',290,330,12,'#4ade80','center');
  // 敌人
  const es=[[310,130,'E1','#f97316'],[550,160,'E2','#3b82f6'],[170,160,'E3','#a855f7'],[630,320,'E4','#ec4899']];
  es.forEach(e=>{glow(x,e[0],e[1],32,'rgba(239,68,68,A)');box(x,e[0]-12,e[1]-12,24,24,7,'#ef4444','#991b1b','rgba(239,68,68,.4)');txt(x,'💀',e[0],e[1]+6,13,'#fff','center');txt(x,e[2],e[0],e[1]-20,13,'#f87171','center');});
  // 道具
  const its=[[300,300,'💊','#22c55e'],[300,225,'📦','#f59e0b'],[125,265,'💎','#38bdf8'],[560,360,'💊','#22c55e'],[175,360,'📦','#f59e0b']];
  its.forEach(p=>{box(x,p[0]-11,p[1]-11,22,22,6,'#1e293b','#111827','rgba(0,0,0,.4)');txt(x,p[2],p[0],p[1]+6,12,'#fff','center');});
  txt(x,'图例： ▨建筑  💀敌人  ▲出生点  👧女儿  💊医疗  📦弹药  💎水晶',500,512,12,'#8b93ab','center');
})();

// ==== 3 玩家角色 ====
(function(){const c=document.getElementById('c3'),x=c.getContext('2d');paper(x,1000,400);
  function soldier(x,cx,top,scale,body1,body2,acc,face){
    x.save();x.translate(cx,top);x.scale(scale,scale);
    x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=14;x.shadowOffsetY=4;
    const grad=(y0,y1,c1,c2)=>{const g=x.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;};
    // 腿
    x.fillStyle=grad(60,140,body1,body2);x.fillRect(-16,60,15,55);x.fillRect(3,60,15,55);
    x.fillStyle=grad(115,135,'#222','#111');x.fillRect(-18,115,19,15);x.fillRect(1,115,19,15);
    // 躯干
    x.fillStyle=grad(28,75,body1,body2);rr(x,-24,28,50,48,6);x.fill();
    x.fillStyle='rgba(255,255,255,.12)';rr(x,-24,28,50,48,6);x.fillRect(-20,34,42,5);
    // 胸甲板
    x.fillStyle=grad(34,70,'rgba(200,210,230,.4)','rgba(120,130,150,.3)');rr(x,-16,36,34,28,4);x.fill();
    x.fillStyle=acc;x.fillRect(-8,40,8,9); // 徽章
    // 手臂
    x.fillStyle=grad(30,70,body1,body2);x.fillRect(-34,30,13,40);x.fillRect(23,30,13,40);
    x.fillStyle=grad(45,70,acc,acc);x.fillRect(-34,48,13,10);x.fillRect(23,48,13,10);
    x.fillStyle='#d4a574';x.fillRect(-34,72,11,10);x.fillRect(23,72,11,10); // 手
    // 头/头盔
    x.fillStyle='#d4a574';x.beginPath();x.arc(0,18,13,0,7);x.fill();
    x.fillStyle=grad(-2,16,'#3a4256','#1e2230');x.beginPath();x.arc(0,12,16,Math.PI,0);x.fill();x.fillRect(-16,10,32,5);
    x.fillStyle=grad(10,16,acc,acc);rr(x,-11,13,22,6,3);x.fill(); // 护目镜
    x.fillStyle='rgba(255,255,255,.6)';x.fillRect(-8,14,4,3);x.fillRect(4,14,4,3);
    x.fillStyle=grad(28,75,'#1c202e','#141826');x.fillRect(-18,30,10,34); // 背包(侧)
    x.restore();
  }
  // 正面（持枪待命）
  soldier(x,260,120,1.5,'#3f6b4f','#27432f','#f0a030','#d4a574');
  txt(x,'正面 · 猎犬战士',260,340,13,'#c4b5fd','center');
  // 侧面（持枪）
  soldier(x,620,120,1.5,'#3f6b4f','#27432f','#f0a030','#d4a574');
  // 步枪
  x.save();x.translate(620,120);x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=8;
  const rg=x.createLinearGradient(20,75,130,85);rg.addColorStop(0,'#3a3f4c');rg.addColorStop(.5,'#5a6070');rg.addColorStop(1,'#2a2e3a');
  x.fillStyle=rg;x.fillRect(24,78,120,9);x.fillRect(130,76,26,7);x.fillStyle='#2a2e3a';x.fillRect(70,68,26,12);x.fillRect(52,88,20,30);x.fillRect(100,88,16,24);x.fillRect(28,87,22,20);
  x.fillStyle='rgba(255,255,255,.35)';x.fillRect(24,78,120,2);x.restore();
  txt(x,'侧面 · 持突击步枪',620,340,13,'#c4b5fd','center');
  // 标注
  const lg=(s,ax,ay,bx,by)=>{x.strokeStyle='rgba(167,139,250,.5)';x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();txt(x,s,bx,by-6,11,'#a78bfa','right');};
  lg('头盔',290,90,400,70);lg('胸甲',300,160,410,150);lg('护腿',330,250,430,260);lg('突击步枪',760,190,900,180);
  txt(x,'士兵 · 25 部件 · 高 1.8m',500,382,11,'#6b7280','center',false);
})();

// ==== 4 突击步枪 ====
(function(){const c=document.getElementById('c4'),x=c.getContext('2d');paper(x,1000,260);
  x.save();x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=16;x.shadowOffsetY=5;
  const y=120,x0=100,grad=(c1,c2)=>{const g=x.createLinearGradient(0,y-16,0,y+16);g.addColorStop(0,c1);g.addColorStop(.5,c2);g.addColorStop(1,c1);return g;};
  // 主体
  x.fillStyle=grad('#5a6070','#2a2e3a');x.fillRect(x0,y-10,780,22);x.fillStyle='rgba(255,255,255,.3)';x.fillRect(x0,y-10,780,3);
  // 护木/散热
  x.fillStyle=grad('#4a5060','#262a36');x.fillRect(x0+30,y-14,180,30);x.fillStyle='#111';for(let i=0;i<5;i++)x.fillRect(x0+50+i*32,y-6,16,4);
  // 导气/消焰
  x.fillStyle='#3a3f4c';x.fillRect(x0+230,y-16,20,12);x.fillStyle=grad('#4a5060','#222');x.fillRect(x0+790,y-15,38,32);x.fillRect(x0+826,y-13,12,28);
  // 机匣
  x.fillStyle=grad('#50586a','#262a36');x.fillRect(x0+320,y-14,200,28);
  // 瞄准镜
  x.fillStyle=grad('#3a4050','#1c202c');x.fillRect(x0+360,y-44,110,18);x.fillStyle='rgba(90,200,230,.5)';x.fillRect(x0+420,y-41,40,12);
  x.fillStyle='#2a2e3a';x.fillRect(x0+390,y-28,20,14);x.fillRect(x0+440,y-28,20,14);
  // 准星
  x.fillStyle='#5a6070';x.fillRect(x0+640,y-20,8,14);x.fillRect(x0+620,y-26,44,4);
  // 弹匣（弧形）
  const mg=grad('#4a5060','#262a36');x.fillStyle=mg;x.fillRect(x0+250,y+12,52,40);x.fillRect(x0+244,y+50,64,10);
  // 握把/扳机/枪托
  x.fillStyle=grad('#3a3f4c','#222');x.fillRect(x0+180,y+12,30,38);x.fillRect(x0+150,y+14,10,10);
  x.fillStyle=grad('#4a5060','#262a36');x.fillRect(x0+40,y+8,90,34);x.fillRect(x0+20,y+4,26,44);
  // 高光
  x.fillStyle='rgba(255,255,255,.25)';x.fillRect(x0+20,y-12,780,2);x.restore();
  // 标注框
  const lb=(s,bx,by)=>{box(x,bx-55,by-16,110,24,6,'#1e1b4b','#14122a','rgba(139,92,246,.2)');txt(x,s,bx,by,11,'#c4b5fd','center',false);};
  lb('枪口',900,60);lb('护木',180,60);lb('瞄准镜',440,28);lb('机匣',560,90);lb('弹匣',300,210);lb('握把',200,200);lb('枪托',120,170);
  txt(x,'突击步枪 · 20 部件 · 全长 ~1.0m',500,240,11,'#6b7280','center',false);
})();

// ==== 5 UI 布局 ====
(function(){const c=document.getElementById('c5'),x=c.getContext('2d');paper(x,1000,320);
  // 顶部 HUD
  x.fillStyle='rgba(10,12,20,.85)';x.fillRect(30,20,940,60);x.strokeStyle='rgba(139,92,246,.3)';x.strokeRect(30,20,940,60);
  // 玩家血条
  box(x,48,30,190,22,8,'rgba(239,68,68,.9)','rgba(153,27,27,.9)','rgba(239,68,68,.3)');txt(x,'猎犬(你)',50,28,12,'#f87171');
  x.fillStyle='rgba(255,255,255,.9)';x.fillRect(52,34,90,4);txt(x,'200/200',52,66,11,'#fff',false);
  // 敌人血条
  box(x,260,30,90,20,7,'rgba(249,115,22,.9)','rgba(154,52,18,.9)','rgba(249,115,22,.3)');txt(x,'E1',266,26,11,'#f97316');txt(x,'120/120',268,62,10,'#fff',false);
  box(x,360,30,90,20,7,'rgba(59,130,246,.9)','rgba(30,64,175,.9)','rgba(59,130,246,.3)');txt(x,'E2',366,26,11,'#3b82f6');
  // 目标
  txt(x,'🔍 女儿距离 23m · 击杀 0 · 入侵者 4/4 · 得分 0',500,55,15,'#fbbf24','center');
  // 准星
  x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;const qx=500,qy=170;
  x.beginPath();x.moveTo(qx,qy-16);x.lineTo(qx,qy-5);x.moveTo(qx,qy+5);x.lineTo(qx,qy+16);x.moveTo(qx-16,qy);x.lineTo(qx-5,qy);x.moveTo(qx+5,qy);x.lineTo(qx+16,qy);x.stroke();
  x.fillStyle='rgba(255,255,255,.9)';x.fillRect(qx-2,qy-2,4,4);
  // 击杀提示
  box(x,330,210,340,36,10,'rgba(22,163,74,.9)','rgba(15,118,110,.9)','rgba(22,163,74,.4)');txt(x,'✦ 击倒 入侵者-先锋 +100',500,234,14,'#fff','center');
  // 开火/摇杆
  glow(x,880,270,60,'rgba(239,68,68,A)');box(x,845,235,70,70,35,'rgba(239,68,68,.8)','rgba(153,27,27,.8)','rgba(239,68,68,.4)');txt(x,'开火',880,285,15,'#fff','center');
  box(x,90,235,90,70,35,'rgba(255,255,255,.12)','rgba(255,255,255,.05)','rgba(0,0,0,.3)');txt(x,'摇杆',135,285,13,'#c4b5fd','center');
  txt(x,'HUD 布局 · 顶部血条+目标 · 中心准星 · 右下开火 · 左下摇杆',500,310,11,'#6b7280','center',false);
})();
