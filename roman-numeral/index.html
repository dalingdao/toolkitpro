<meta name="keywords" content="罗马数字,roman numeral,罗马数字转换,阿拉伯数字,免费工具">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}
.header{text-align:center;padding:36px 20px 24px}

.field label{font-size:13px;color:#475569;display:block;margin-bottom:6px;font-weight:600}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #cbd5e1;font-size:18px}
.result{margin-top:16px;background:#eff6ff;border-radius:12px;padding:24px;text-align:center}

<body>
<a class="back" href="/toolkitpro/">← 返回工具箱</a>
<div class="header">
  <h1>🏛️ Roman Numeral</h1>

  <div class="badges"><span class="badge">纯前端</span><span class="badge">互转</span><span class="badge">1-3999</span></div>
</div>
<div class="container">
  <div class="card">
    <div class="field"><label>阿拉伯数字</label><input type="number" id="num" value="2024" min="1" max="3999" oninput="toR()"></div>
    <div class="result" id="res"></div>
  </div>
</div>
<footer>ToolkitPro · Roman Numeral · 纯前端</footer>
<script>
function toR(){
  let n=+document.getElementById('num').value;
  if(!n||n<1||n>3999){document.getElementById('res').innerHTML='<div class="sub">请输入 1-3999</div>';return}
  const map=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let out='';
  map.forEach(([v,s])=>{while(n>=v){out+=s;n-=v}});
  document.getElementById('res').innerHTML='<div class="big">'+out+'</div>';
}
toR();
</script>
