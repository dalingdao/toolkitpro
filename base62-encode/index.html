<style>

<body>
<a class="back" href="/toolkitpro/">← 返回工具箱</a>
<div class="header">
  <h1>🔐 Base62 Encode</h1>

  <div class="badges"><span class="badge">纯前端</span><span class="badge">Base62</span><span class="badge">Agent可用</span></div>
</div>
<div class="container">
  <div class="card">
    <div class="seg">
      <button id="s1" class="on" onclick="m(1)">编码</button>
      <button id="s2" onclick="m(2)">解码</button>
    </div>
    <textarea id="in" placeholder="输入文本">Hello ToolkitPro</textarea>
    <textarea id="out" placeholder="输出"></textarea>
  </div>
</div>
<footer>ToolkitPro · Base62 Encode · 纯前端 · Agent可用</footer>
<script>
var CH='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',M=1;
function m(x){M=x;document.getElementById('s1').className=M===1?'on':'';document.getElementById('s2').className=M===2?'on':'';run();}
function b62(bytes,enc){
  if(enc){var out='',val=0;for(var i=0;i<bytes.length;i++){val=val*256+bytes[i];}
    // big-int free: process byte by byte
    var num=Array.from(bytes);
    var digits=[];
    while(num.length){var rem=0;for(var j=0;j<num.length;j++){var cur=rem*256+num[j];num[j]=Math.floor(cur/62);rem=cur%62;}digits.push(rem);while(num.length&&num[0]===0)num.shift();}
    return digits.reverse().map(function(d){return CH[d]}).join('')||'0';
  }
  // decode
  var num=[];for(var i2=0;i2<bytes.length;i2++){var d=CH.indexOf(bytes[i2]);if(d<0)throw 0;
    var carry=d;for(var j2=0;j2<num.length||carry;j2++){if(j2===num.length)num.push(0);var cur2=num[j2]*62+carry;num[j2]=cur2&255;carry=cur2>>8;}}
  return num;
}
function run(){
  var v=document.getElementById('in').value,el=document.getElementById('out');
  try{
    if(M===1){var bytes=[];for(var i=0;i<v.length;i++){var cp=v.codePointAt(i);var b=[];while(cp){b.unshift(cp&255);cp>>=8;}if(!b.length)b=[0];bytes=bytes.concat(b);}el.value=b62(bytes,true);}
    else{el.value=b62(v,false).map(function(x){return String.fromCharCode(x)}).join('');}
  }catch(e){el.value='（输入无效）';}
}
run();
document.getElementById('in').addEventListener('input',run);
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    var v=q.get('input')||'';
    var bytes=[];for(var i=0;i<v.length;i++){var cp=v.codePointAt(i);var b=[];while(cp){b.unshift(cp&255);cp>>=8;}if(!b.length)b=[0];bytes=bytes.concat(b);}
    document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify({encoded:b62(bytes,true)},null,2)+'</pre>';
  }
})();
</script>
