<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}

<body>
<a class="back" href="/toolkitpro/">鈫?杩斿洖宸ュ叿绠?/a>
<div class="header">
  <h1>馃摝 TOML to JSON</h1>
  <p>鍏嶈垂鍦ㄧ嚎TOML杞琂SON鈥斺€?绠€鍗昑OML瀛愰泦銆傛敮鎸??input= &format=json 渚?Agent 璋冪敤銆?/p>
  <div class="badges"><span class="badge">绾墠绔?/span><span class="badge">TOML</span><span class="badge">Agent鍙敤</span></div>
</div>
<div class="container">
  <div class="card">
    <textarea id="toml" placeholder='[server]&#10;host = "localhost"&#10;port = 8080'>[server]
host = "localhost"
port = 8080
enabled = true
[db]
name = "app"
tables = ["users","orders"]</textarea>
    <button class="btn" onclick="conv()">杞?JSON</button>
    <textarea id="out" style="margin-top:12px" placeholder="JSON 杈撳嚭"></textarea>
  </div>
</div>
<footer>ToolkitPro 路 TOML to JSON 路 绾墠绔?路 Agent鍙敤</footer>
<script>
function parseVal(s){
  s=s.trim();
  if(s==='true')return true;if(s==='false')return false;
  if(s[0]==='"')return s.slice(1,-1).replace(/\\"/g,'"');
  if(s[0]==='[')return s.slice(1,-1).split(',').map(parseVal);
  return Number(s);
}
function conv(){
  var el=document.getElementById('out');
  try{
    var txt=document.getElementById('toml').value,root={},cur=root;
    txt.split('\n').forEach(function(line){
      line=line.replace(/#.*/,'').trim();
      if(!line)return;
      if(line[0]==='['){var p=line.slice(1,-1).split('.');cur=root;p.forEach(function(k,i){if(!cur[k])cur[k]={};cur=cur[k];});}
      else{var eq=line.indexOf('=');if(eq>0)cur[line.slice(0,eq).trim()]=parseVal(line.slice(eq+1));}
    });
    el.value=JSON.stringify(root,null,2);
  }catch(e){el.value='锛圱OML 瑙ｆ瀽閿欒锛?;}
}
conv();
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    var txt=q.get('input')||'',root={},cur=root;
    txt.split('\n').forEach(function(line){
      line=line.replace(/#.*/,'').trim();if(!line)return;
      if(line[0]==='['){var p=line.slice(1,-1).split('.');cur=root;p.forEach(function(k){if(!cur[k])cur[k]={};cur=cur[k];});}
      else{var eq=line.indexOf('=');if(eq>0)cur[line.slice(0,eq).trim()]=parseVal(line.slice(eq+1));}
    });
    document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify(root,null,2)+'</pre>';
  }
})();
</script>
</body>
