<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}
.header{text-align:center;padding:36px 20px 24px}

<body>

<script>

  document.getElementById('res').innerHTML='<div class="big">楼'+price.toLocaleString('zh-CN',{maximumFractionDigits:2})+'</div><div class="sub">寤鸿鍞环<br>姣涘埄 楼'+profit.toLocaleString('zh-CN',{maximumFractionDigits:2})+'锛?+m+'% 鍔犱环锛?/div>';
}

(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    var c=+q.get('cost')||0,m=+q.get('markup')||0,price=c*(1+m/100);
    document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify({price:price,profit:price-c},null,2)+'</pre>';
