<body>

</div>
<div class="container">
  <div class="card">
    <div class="field"><label>鏁板€?/label><input type="number" id="v" value="100" min="0" oninput="calc()"></div>
    <div class="field"><label>鍗曚綅</label><select id="u" onchange="calc()">
      <option value="kmh" selected>鍗冪背/灏忔椂 km/h</option><option value="ms">绫?绉?m/s</option><option value="mph">鑻遍噷/灏忔椂 mph</option><option value="knot">鑺?knot</option>

</div>

<script>
var R={kmh:1,ms:0.277778,mph:0.621371,knot:0.539957};
function calc(){
  var v=+document.getElementById('v').value||0,u=document.getElementById('u').value;
  var kmh=v/R[u];
  var rows=Object.keys(R).map(function(k){return '<div class="row"><span>'+k+'</span><b>'+(kmh*R[k]).toLocaleString('en-US',{maximumFractionDigits:4})+'</b></div>';}).join('');
  document.getElementById('res').innerHTML=rows;
}
calc();
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    var v=+q.get('value')||0,u=q.get('unit')||'kmh',kmh=v/R[u],out={kmh:kmh};
    Object.keys(R).forEach(function(k){out[k]=kmh*R[k];});
    document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify(out,null,2)+'</pre>';
  }
})();
</script>
