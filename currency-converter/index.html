<script>
// 鍙傝€冩眹鐜囷細1 CNY = X 澶栧竵锛堝彲缂栬緫锛?var rate={CNY:1,USD:0.14,EUR:0.13,JPY:21.5,GBP:0.11,HKD:1.09,KRW:193};
function calc(){
  var amt=+document.getElementById('amt').value||0,f=document.getElementById('from').value,t=document.getElementById('to').value;
  var out=amt*rate[t]/rate[f];
  var el=document.getElementById('res');

}
