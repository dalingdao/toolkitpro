<body>

<script>
function calc(){
  var a=new Date(document.getElementById('a').value),b=new Date(document.getElementById('b').value);
  var el=document.getElementById('res');
  if(isNaN(a)||isNaN(b)){el.innerHTML='<div class="sub">璇烽€夋嫨鏃ユ湡</div>';return;}
  var d=Math.abs(b-a)/86400000;
  var dir=b>=a?'':'锛堝€掑簭锛屽彇缁濆鍊硷級';
  var weeks=d/7, months=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()), years=d/365.25;
  var wd=0;for(var t=new Date(Math.min(a,b));t<=new Date(Math.max(a,b));t.setDate(t.getDate()+1)){var g=t.getDay();if(g>0&&g<6)wd++;}
  el.innerHTML='<div class="big">'+Math.round(d)+' 澶?/div><div class="sub">绾?'+weeks.toFixed(1)+' 鍛?br>绾?'+months+' 涓湀<br>绾?'+years.toFixed(1)+' 骞?br>宸ヤ綔鏃ワ紙鍛ㄤ竴鑷冲懆浜旓級绾?'+wd+' 澶?/div>';
}
