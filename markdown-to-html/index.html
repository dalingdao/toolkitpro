<script>
function mdToHtml(md){
  var esc=function(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  var lines=md.replace(/\r/g,'').split('\n'),html='',inList=false;
  function closeList(){if(inList){html+='</ul>';inList=false;}}
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(/^###\s/.test(l)){closeList();html+='<h3>'+esc(l.replace(/^###\s+/,''))+'</h3>';}
    else if(/^##\s/.test(l)){closeList();html+='<h2>'+esc(l.replace(/^##\s+/,''))+'</h2>';}
    else if(/^#\s/.test(l)){closeList();html+='<h1>'+esc(l.replace(/^#\s+/,''))+'</h1>';}
    else if(/^[-*]\s/.test(l)){if(!inList){html+='<ul>';inList=true;}html+='<li>'+esc(l.replace(/^[-*]\s+/,''))+'</li>';}
    else if(/^\s*$/.test(l)){closeList();}
    else if(/^---\s*$/.test(l)){closeList();html+='<hr>';}
    else{closeList();html+='<p>'+esc(l)+'</p>';}
  }
  closeList();
  return html;
}
function conv(){document.getElementById('out').value=mdToHtml(document.getElementById('md').value);}
conv();

})();
