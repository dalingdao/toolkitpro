<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL 编码解码器 - 在线工具</title>
<meta name="description" content="免费在线 URL 编码解码工具。将文本转换为 URL 编码格式，或解码 URL 编码为可读文本。支持 UTF-8，即时转换。">
<meta name="keywords" content="URL编码, URL解码, URL encoder, URL decoder, 在线工具, percent encoding">
<meta property="og:title" content="URL 编码解码器 - 在线工具">
<meta property="og:description" content="免费在线 URL 编码解码工具，即时转换，支持 UTF-8。">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #eef1f6 100%); min-height: 100vh; padding: 40px 20px; color: #2d3748; }
.container { max-width: 860px; margin: 0 auto; }
h1 { text-align: center; font-size: 28px; margin-bottom: 10px; color: #1a202c; }
.sub { text-align: center; color: #718096; margin-bottom: 30px; font-size: 14px; }
.toolbox { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { padding: 10px 20px; border: none; background: #edf2f7; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: #4a5568; transition: all 0.2s; }
.tab.active { background: #3182ce; color: #fff; }
.input-area { margin-bottom: 16px; }
label { font-size: 13px; color: #718096; display: block; margin-bottom: 8px; font-weight: 600; }
textarea, input[type=text] { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px; font-family: 'SF Mono', Consolas, monospace; resize: vertical; min-height: 120px; transition: border-color 0.2s; }
textarea:focus, input[type=text]:focus { outline: none; border-color: #3182ce; }
.controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.btn { padding: 10px 24px; border: none; border-radius: 10px; background: #3182ce; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.btn:hover { background: #2c5282; }
.btn.secondary { background: #718096; }
.btn.secondary:hover { background: #4a5568; }
.result-area { position: relative; }
.result { background: #f7fafc; border-radius: 10px; padding: 14px; min-height: 80px; font-size: 14px; font-family: 'SF Mono', Consolas, monospace; word-break: break-all; border: 2px solid #e2e8f0; }
.stats { margin-top: 12px; font-size: 13px; color: #718096; display: flex; gap: 20px; flex-wrap: wrap; }
.copy-btn { margin-top: 10px; }
.info { margin-top: 30px; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
.info h2 { font-size: 18px; margin-bottom: 12px; color: #1a202c; }
.info p { font-size: 14px; color: #4a5568; line-height: 1.8; }
footer { text-align: center; margin-top: 30px; color: #a0aec0; font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <h1>URL 编码解码器</h1>
  <p class="sub">在线 URL 编码解码工具 - 即时转换，支持 UTF-8</p>
  
  <div class="toolbox">
    <div class="tabs">
      <button class="tab active" data-mode="encode">编码 (Encode)</button>
      <button class="tab" data-mode="decode">解码 (Decode)</button>
    </div>
    
    <div class="input-area">
      <label>输入文本</label>
      <textarea id="input" placeholder="输入要编码/解码的文本..."></textarea>
    </div>
    
    <div class="controls">
      <button class="btn" id="convert">转换</button>
      <button class="btn secondary" id="swap">交换</button>
      <button class="btn secondary" id="clear">清空</button>
    </div>
    
    <div class="result-area">
      <label>结果</label>
      <div class="result" id="output">等待输入...</div>
      <div class="stats">
        <span>字符数: <b id="inLen">0</b></span>
        <span>结果长度: <b id="outLen">0</b></span>
      </div>
      <button class="btn secondary copy-btn" id="copy">复制结果</button>
    </div>
  </div>
  
  <div class="info">
    <h2>什么是 URL 编码？</h2>
    <p>URL 编码（又称 percent-encoding）是一种将特殊字符转换为 %XX 格式的编码方式，用于在 URL 中安全传输数据。例如空格编码为 %20，中文字符编码为 %E4%B8%AD 等。此工具支持 UTF-8 编码，可将任何文本安全地转换为 URL 可用的格式。</p>
  </div>
  
  <footer>© 2026 ToolkitPro - 免费在线工具集</footer>
</div>

<script>
let mode = 'encode';
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    convert();
  });
});

function convert() {
  const input = document.getElementById('input').value;
  const output = document.getElementById('output');
  document.getElementById('inLen').textContent = input.length;
  if (!input) { output.textContent = '等待输入...'; document.getElementById('outLen').textContent = '0'; return; }
  try {
    if (mode === 'encode') {
      output.textContent = encodeURIComponent(input).replace(/%20/g, '+');
    } else {
      output.textContent = decodeURIComponent(input.replace(/\+/g, '%20'));
    }
  } catch (e) {
    output.textContent = '错误: 无效的输入格式';
  }
  document.getElementById('outLen').textContent = output.textContent.length;
}

document.getElementById('convert').addEventListener('click', convert);
document.getElementById('input').addEventListener('input', convert);

document.getElementById('swap').addEventListener('click', () => {
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  if (output.textContent && output.textContent !== '等待输入...' && !output.textContent.startsWith('错误')) {
    input.value = output.textContent;
    convert();
  }
});

document.getElementById('clear').addEventListener('click', () => {
  document.getElementById('input').value = '';
  document.getElementById('output').textContent = '等待输入...';
  document.getElementById('inLen').textContent = '0';
  document.getElementById('outLen').textContent = '0';
});

document.getElementById('copy').addEventListener('click', async () => {
  const out = document.getElementById('output').textContent;
  try { await navigator.clipboard.writeText(out); document.getElementById('copy').textContent = '已复制!'; }
  catch(e) { document.getElementById('copy').textContent = '复制失败'; }
  setTimeout(() => { document.getElementById('copy').textContent = '复制结果'; }, 1500);
});

convert();
</script>
</body>
</html>
