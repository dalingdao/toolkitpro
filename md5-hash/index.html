    <p>MD5（Message-Digest Algorithm 5）是一种广泛使用的哈希函数，将任意长度的输入转换为 128 位（32 个十六进制字符）的哈希值。常用于数据完整性校验（如文件下载校验）。注意：MD5 已不适用于安全加密场景，但仍是快速校验数据的常用工具。</p>

<script>
function md5(str) {
  function rotl(x, c) { return (x << c) | (x >>> (32 - c)); }
  function toBytes(s) { const utf8 = unescape(encodeURIComponent(s)); const b = []; for (let i = 0; i < utf8.length; i++) b.push(utf8.charCodeAt(i)); return b; }
  const bytes = toBytes(str);
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 0; i < 8; i++) bytes.push((bitLen / Math.pow(2, 8 * i)) & 0xff);
  let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
  const K = [], S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296);
  for (let off = 0; off < bytes.length; off += 64) {
    const M = []; for (let i = 0; i < 16; i++) M[i] = bytes[off + i*4] | (bytes[off + i*4+1] << 8) | (bytes[off + i*4+2] << 16) | (bytes[off + i*4+3] << 24);
    let A = a0, B = b0, C = c0, D = d0;
    for (let i = 0; i < 64; i++) {
      let F, g;
      if (i < 16) { F = (B & C) | (~B & D); g = i; }
      else if (i < 32) { F = (D & B) | (~D & C); g = (5*i + 1) % 16; }
      else if (i < 48) { F = B ^ C ^ D; g = (3*i + 5) % 16; }
      else { F = C ^ (B | ~D); g = (7*i) % 16; }
      F = (F + A + K[i] + M[g]) >>> 0;
      A = D; D = C; C = B; B = (B + rotl(F, S[i])) >>> 0;
    }
    a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0; c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0;
  }
  return [a0,b0,c0,d0].map(v => ('00000000' + (v >>> 0).toString(16)).slice(-8)).join('');
}
document.getElementById('calc').addEventListener('click', () => { const v = document.getElementById('input').value; document.getElementById('output').textContent = v ? md5(v) : '等待输入...'; });
document.getElementById('clear').addEventListener('click', () => { document.getElementById('input').value=''; document.getElementById('output').textContent='等待输入...'; });
</script>
