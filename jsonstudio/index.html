<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Studio - JSON 格式化验证转换工�?/title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--acc:#22c55e;--acc2:#3b82f6;--err:#ef4444;--text:#e2e8f0;--muted:#94a3b8;--border:#334155}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
header{text-align:center;margin-bottom:16px}
header h1{font-size:22px;color:var(--acc)}
header p{color:var(--muted);font-size:12px;margin-top:3px}
.toolbar{max-width:1000px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.toolbar button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer}
.toolbar button:hover{border-color:var(--acc)}
.toolbar button.primary{background:var(--acc);border:none;color:#0f172a;font-weight:600}
.main{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.panel h3{font-size:13px;color:var(--muted);margin-bottom:8px}
textarea{width:100%;height:350px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-family:'Fira Code',Consolas,monospace;font-size:13px;resize:vertical;line-height:1.5}
.status{padding:6px 10px;border-radius:6px;font-size:12px;margin-top:8px;display:none}
.status.ok{display:block;background:rgba(34,197,94,.15);color:var(--acc);border:1px solid rgba(34,197,94,.3)}
.status.err{display:block;background:rgba(239,68,68,.15);color:var(--err);border:1px solid rgba(239,68,68,.3)}
.stats{font-size:11px;color:var(--muted);margin-top:6px}
.output{white-space:pre-wrap;word-break:break-all}
.tree-view{font-family:monospace;font-size:12px;max-height:350px;overflow:auto;line-height:1.6}
.tree-view .key{color:var(--acc2)}
.tree-view .str{color:var(--acc)}
.tree-view .num{color:#f59e0b}
.tree-view .bool{color:#ec4899}
.tree-view .null{color:var(--muted)}
.tree-view .fold{cursor:pointer;color:var(--muted)}
.tree-view .fold:hover{color:var(--text)}
</style>
</head>
<body>
<header><h1>📋 JSON Studio</h1><p>格式�?· 验证 · 压缩 · 转CSV · 树形查看 · 纯前�?/p></header>
<div class="toolbar">
  <button class="primary" onclick="format()">格式�?/button>
  <button onclick="minify()">压缩</button>
  <button onclick="validate()">验证</button>
  <button onclick="toCSV()">转CSV</button>
  <button onclick="treeView()">树形查看</button>
  <button onclick="escapeJson()">转义JSON</button>
  <button onclick="unescapeJson()">反转�?/button>
  <button onclick="copyOutput()">复制结果</button>
  <button onclick="clearAll()">清空</button>
</div>
<div class="main">
  <div class="panel">
    <h3>输入 JSON</h3>
    <textarea id="input" placeholder='{"name":"test","value":123,"items":[1,2,3]}'></textarea>
    <div class="status" id="status"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="panel">
    <h3>输出</h3>
    <textarea id="output" class="output" placeholder="结果将显示在这里..."></textarea>
    <div class="tree-view" id="treeView"></div>
    <div class="stats" id="outStats"></div>
  </div>
</div>
<script>
function setStatus(msg,type){const s=document.getElementById('status');s.className='status '+type;s.textContent=msg;}
function setStats(n){document.getElementById('stats').textContent=n?'字符�? '+n:'';}
function parseInput(){const txt=document.getElementById('input').value.trim();if(!txt){setStatus('请输入JSON','err');return null;}try{return JSON.parse(txt);}catch(e){setStatus('�?'+e.message,'err');return null;}}
function format(){const data=parseInput();if(data===null)return;const out=JSON.stringify(data,null,2);document.getElementById('output').value=out;document.getElementById('treeView').innerHTML='';setStatus('�?格式化成�?,'ok');document.getElementById('outStats').textContent='输出字符�? '+out.length;setStats(document.getElementById('input').value.length);}
function minify(){const data=parseInput();if(data===null)return;const out=JSON.stringify(data);document.getElementById('output').value=out;document.getElementById('treeView').innerHTML='';setStatus('�?压缩成功 ('+out.length+' 字符)','ok');document.getElementById('outStats').textContent='压缩�? '+Math.round((1-out.length/document.getElementById('input').value.length)*100)+'%';setStats(document.getElementById('input').value.length);}
function validate(){const txt=document.getElementById('input').value.trim();if(!txt){setStatus('请输入JSON','err');return;}try{const d=JSON.parse(txt);const type=Array.isArray(d)?'array['+d.length+']':typeof d==='object'?'object ('+Object.keys(d).length+' keys)':typeof d;setStatus('�?有效JSON · 类型: '+type,'ok');setStats(txt.length);}catch(e){setStatus('�?无效JSON: '+e.message,'err');setStats(txt.length);}}
function toCSV(){const data=parseInput();if(data===null)return;let rows=[];if(Array.isArray(data)){if(data.length===0){setStatus('空数�?,'err');return;}const keys=typeof data[0]==='object'&&data[0]!==null?Object.keys(data[0]):['value'];rows.push(keys.join(','));for(const item of data){if(typeof item==='object'&&item!==null){rows.push(keys.map(k=>csvCell(item[k])).join(','));}else{rows.push(csvCell(item));}}}else if(typeof data==='object'&&data!==null){rows.push('key,value');for(const[k,v]of Object.entries(data)){rows.push(csvCell(k)+','+csvCell(v));}}else{setStatus('仅支持对象或数组转CSV','err');return;}const out=rows.join('\n');document.getElementById('output').value=out;document.getElementById('treeView').innerHTML='';setStatus('�?CSV转换成功 ('+rows.length+'�?','ok');document.getElementById('outStats').textContent='行数: '+rows.length;setStats(document.getElementById('input').value.length);}
function csvCell(v){if(v===null||v===undefined)return'';if(typeof v==='object')v=JSON.stringify(v);const s=String(v);return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function escapeJson(){const txt=document.getElementById('input').value;if(!txt){setStatus('请输入内�?,'err');return;}const out=JSON.stringify(txt);document.getElementById('output').value=out;document.getElementById('treeView').innerHTML='';setStatus('�?转义成功','ok');setStats(txt.length);}
function unescapeJson(){const txt=document.getElementById('input').value.trim();if(!txt){setStatus('请输入内�?,'err');return;}try{const out=JSON.parse(txt);if(typeof out==='string'){document.getElementById('output').value=out;}else{document.getElementById('output').value=JSON.stringify(out,null,2);}setStatus('�?反转义成�?,'ok');setStats(txt.length);}catch(e){setStatus('�?不是有效的转义字符串','err');}}
function treeView(){const data=parseInput();if(data===null)return;document.getElementById('output').value='';const tv=document.getElementById('treeView');tv.innerHTML=buildTree(data,'root');setStatus('�?树形查看','ok');setStats(document.getElementById('input').value.length);}
function buildTree(data,key,depth){const indent='  '.repeat(depth);const type=Array.isArray(data)?'array':data===null?'null':typeof data;if(type==='object'||type==='array'){const children=type==='array'?data:Object.entries(data);const open='{',close='}';const arrOpen='[',arrClose=']';const o=type==='array'?arrOpen:open;const c=type==='array'?arrClose:close;let html=indent+'<span class="key">"'+esc(key)+'"</span>: '+o+'<br>';const entries=type==='array'?data.map((v,i)=>[i,v]):Object.entries(data);for(const[k,v]of entries){html+=buildTree(v,k,depth+1);}html+=indent+c;if(depth>0)html+=',';html+='<br>';return html;}else{return indent+'<span class="key">"'+esc(key)+'"</span>: <span class="'+type+'">'+esc(JSON.stringify(data))+'</span>'+(depth>0?',':'')+'<br>';}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyOutput(){const out=document.getElementById('output').value;if(!out){setStatus('无内容可复制','err');return;}navigator.clipboard.writeText(out).then(()=>setStatus('�?已复制到剪贴�?,'ok')).catch(()=>setStatus('�?复制失败','err'));}
function clearAll(){document.getElementById('input').value='';document.getElementById('output').value='';document.getElementById('treeView').innerHTML='';document.getElementById('status').className='status';document.getElementById('status').textContent='';document.getElementById('stats').textContent='';document.getElementById('outStats').textContent='';}
// Auto-format on load with sample
document.getElementById('input').value='{"name":"JSON Studio","version":"1.0","features":["format","validate","minify","csv","tree"],"author":{"email":"example@toolkitpro.dev"},"active":true,"downloads":0}';
format();
</script>
</body>
</html>
