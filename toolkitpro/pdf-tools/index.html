<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Tools Pro - 免费在线 PDF 合并/拆分工具（纯前端）</title>
<meta name="description" content="免费在线 PDF 合并、拆分工具，纯前端运行，数据不出浏览器，无需注册，支持多个 PDF 合并为一个，单 PDF 按页拆分。">
<meta name="keywords" content="PDF合并,PDF拆分,在线PDF工具,pdf merge,pdf split,免费工具">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}
.header{text-align:center;padding:36px 20px 24px}
.header h1{font-size:28px;font-weight:800;color:#0f172a;margin-bottom:8px}
.header p{color:#64748b;font-size:14px;max-width:640px;margin:0 auto}
.badges{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#dcfce7;color:#166534}
.container{max-width:960px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:12px;text-align:center;border:2px solid #cbd5e1;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:#475569;background:#fff}
.tab.active{border-color:#3b82f6;background:#eff6ff;color:#2563eb}
.drop{background:#fff;border:2px dashed #cbd5e1;border-radius:16px;padding:40px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.drag{border-color:#3b82f6;background:#eff6ff}
.drop .icon{font-size:40px;margin-bottom:10px}
.drop p{color:#64748b;font-size:14px}
.btn{background:#3b82f6;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:14px}
.btn:hover{background:#2563eb}
.btn:disabled{background:#94a3b8;cursor:not-allowed}
.list{margin-top:16px}
.file-item{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.file-item span{font-size:13px;color:#334155}
.file-item small{color:#94a3b8}
.del{background:#fee2e2;color:#dc2626;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.back{display:inline-block;margin:20px;font-size:13px;color:#64748b;text-decoration:none}
footer{text-align:center;padding:24px;color:#94a3b8;font-size:12px}
#status{font-size:13px;color:#64748b;margin-top:12px}
</style>
<script data-goatcounter="https://dalingdao.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<a class="back" href="/toolkitpro/">← 返回工具箱</a>
<div class="header">
  <h1>📄 PDF Tools Pro</h1>
  <p>免费在线 PDF 合并/拆分工具—— 纯前端运行，数据不出浏览器，无需注册。</p>
  <div class="badges"><span class="badge">纯前端</span><span class="badge">隐私安全</span><span class="badge">无需注册</span></div>
</div>
<div class="container">
  <div class="tabs">
    <div class="tab active" id="tab-merge" onclick="setTab('merge')">🔗 合并 PDF</div>
    <div class="tab" id="tab-split" onclick="setTab('split')">✂️ 拆分 PDF</div>
  </div>
  <div id="panel-merge">
    <div class="drop" id="drop-merge">
      <div class="icon">📁</div>
      <p>点击或拖拽多个 PDF 到这里（按顺序合并）</p>
      <input type="file" id="file-merge" accept="application/pdf" multiple style="display:none">
    </div>
    <div class="list" id="list-merge"></div>
    <button class="btn" id="btn-merge" onclick="doMerge()">🔗 合并并下载</button>
    <div id="status"></div>
  </div>
  <div id="panel-split" style="display:none">
    <div class="drop" id="drop-split">
      <div class="icon">📄</div>
      <p>点击或拖拽一个 PDF 到这里（按页拆分）</p>
      <input type="file" id="file-split" accept="application/pdf" style="display:none">
    </div>
    <div class="list" id="list-split"></div>
    <button class="btn" id="btn-split" onclick="doSplit()" disabled>✂️ 拆分并下载</button>
    <div id="status2"></div>
  </div>
</div>
<footer>ToolkitPro · PDF Tools Pro · 纯前端 · pdf-lib</footer>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
let mergeFiles=[],splitFile=null;
function setTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.getElementById('panel-merge').style.display=t==='merge'?'block':'none';
  document.getElementById('panel-split').style.display=t==='split'?'block':'none';
}
function bindDrop(dropId,inputId,cb){
  const drop=document.getElementById(dropId),input=document.getElementById(inputId);
  drop.addEventListener('click',()=>input.click());
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});
  drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');cb(Array.from(e.dataTransfer.files))});
  input.addEventListener('change',()=>cb(Array.from(input.files)));
}
function showMergeList(){
  const el=document.getElementById('list-merge');
  el.innerHTML=mergeFiles.map((f,i)=>'<div class="file-item"><span>'+f.name+' <small>('+Math.round(f.size/1024)+' KB)</small></span><button class="del" onclick="mergeFiles.splice('+i+',1);showMergeList()">✕</button></div>').join('');
  document.getElementById('btn-merge').disabled=mergeFiles.length<2;
}
bindDrop('drop-merge','file-merge',files=>{mergeFiles=mergeFiles.concat(files);showMergeList()});
bindDrop('drop-split','file-split',files=>{if(files[0]){splitFile=files[0];document.getElementById('list-split').innerHTML='<div class="file-item"><span>'+splitFile.name+' <small>('+Math.round(splitFile.size/1024)+' KB)</small></span></div>';document.getElementById('btn-split').disabled=false}});
async function doMerge(){
  const s=document.getElementById('status');s.textContent='正在合并...';
  try{
    const merged=await PDFLib.PDFDocument.create();
    for(const f of mergeFiles){const d=await PDFLib.PDFDocument.load(await f.arrayBuffer());const pages=await merged.copyPages(d,d.getPageIndices());pages.forEach(p=>merged.addPage(p))}
    const buf=await merged.save();download(buf,'merged-'+Date.now()+'.pdf');s.textContent='✅ 合并成功，'+mergeFiles.length+' 个 PDF → '+Math.round(buf.length/1024)+' KB';
  }catch(e){s.textContent='❌ 错误: '+e.message}
}
async function doSplit(){
  const s=document.getElementById('status2');s.textContent='正在拆分...';
  try{
    const d=await PDFLib.PDFDocument.load(await splitFile.arrayBuffer());
    for(let i=0;i<d.getPageCount();i++){
      const nd=await PDFLib.PDFDocument.create();const [pg]=await nd.copyPages(d,[i]);nd.addPage(pg);
      const buf=await nd.save();download(buf,splitFile.name.replace(/\.pdf$/i,'')+'-page'+(i+1)+'.pdf');
    }
    s.textContent='✅ 拆分完成，共 '+d.getPageCount()+' 页（已逐个下载）';
  }catch(e){s.textContent='❌ 错误: '+e.message}
}
function download(buf,name){const blob=new Blob([buf],{type:'application/pdf'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
</script>
</body>
</html>
