<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Maker - 免费在线决策器</title>
<meta name="description" content="免费在线决策器，随机帮你做选择，纯前端，无需注册，支持URL参数供AI Agent调用。">
<meta name="keywords" content="决策器,decision maker,选择,随机,抛硬币,免费工具">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{text-align:center;padding:36px 20px 24px}
.header h1{font-size:28px;font-weight:800;margin-bottom:8px}
.header p{color:#ffe4e6;font-size:14px}
.badges{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(255,255,255,0.2)}
.card{max-width:560px;width:90%;background:rgba(255,255,255,0.15);border-radius:16px;padding:24px}
textarea{width:100%;height:100px;padding:11px;border-radius:10px;border:none;font-size:15px;margin-bottom:12px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#fff;color:#be185d;font-size:18px;font-weight:700;cursor:pointer}
.ans{margin-top:20px;text-align:center;font-size:28px;font-weight:800;min-height:50px}
.back{display:inline-block;margin:20px;font-size:13px;color:#ffe4e6;text-decoration:none}
</style>
<script data-goatcounter="https://dalingdao.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<a class="back" href="/toolkitpro/">← 返回工具箱</a>
<div class="header">
  <h1>🎲 Decision Maker</h1>
  <p>免费在线决策器—— 随机帮你做选择。</p>
  <div class="badges"><span class="badge">纯前端</span><span class="badge">随机</span><span class="badge">Agent可用</span></div>
</div>
<div class="card">
  <textarea id="opts" placeholder="每行一个选项">吃火锅
吃烧烤
吃日料
吃面</textarea>
  <button class="btn" onclick="pick()">帮我决定！</button>
  <div class="ans" id="ans"></div>
</div>
<script>
function pick(){
  var opts=document.getElementById('opts').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  if(!opts.length){document.getElementById('ans').textContent='请先输入选项';return;}
  document.getElementById('ans').textContent='✨ '+opts[Math.floor(Math.random()*opts.length)];
}
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    var opts=(q.get('options')||'a,b').split(/[\n,]/).filter(Boolean);
    document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify({decision:opts[Math.floor(Math.random()*opts.length)]},null,2)+'</pre>';
  }
})();
</script>
</body>
</html>
