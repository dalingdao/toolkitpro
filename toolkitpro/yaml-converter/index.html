<script>
// 轻量 YAML 解析（子集）
function parseYAML(t){
  const lines=t.split('\n');
  const obj={};let stack=[obj];const indents=[-1];
  lines.forEach(line=>{
    if(!line.trim()||line.trim().startsWith('#'))return;
    const ind=line.match(/^ */)[0].length;
    while(ind<=indents[indents.length-1]){stack.pop();indents.pop()}
    const cur=stack[stack.length-1];
    const m=line.trim().match(/^([^:]+):(.*)$/);
    if(!m)return;
    const key=m[1].trim().replace(/^['"]|['"]$/g,''),val=m[2].trim();
    if(val.startsWith('- ')){
      if(!Array.isArray(cur[key])){cur[key]=[]}
      cur[key].push(parseVal(val.slice(2).trim()));
    }else if(val===''){
      const nv={};cur[key]=nv;stack.push(nv);indents.push(ind);
    }else{
      cur[key]=parseVal(val);
    }
  });
  return obj;
}
function parseVal(v){
  if(v==='null')return null;
  if(v==='true')return true;
  if(v==='false')return false;
  if(v.startsWith('[')&&v.endsWith(']'))return v.slice(1,-1).split(',').map(x=>parseVal(x.trim()));
  if(!isNaN(v))return +v;
  return v.replace(/^['"]|['"]$/g,'');
}
function toYAML(o,ind){
  ind=ind||0;const pad='  '.repeat(ind);let out='';
  if(Array.isArray(o)){o.forEach(v=>{out+=pad+'- '+toYAML(v,0).trim()+'\n'});return out}
  if(typeof o==='object'&&o!==null){
    Object.keys(o).forEach(k=>{
      const v=o[k];
      if(typeof v==='object'&&v!==null){out+=pad+k+':\n'+toYAML(v,ind+1)}
      else out+=pad+k+': '+v+'\n';
    });
    return out;
  }
  return String(o);
}
function y2j(){
  try{const obj=parseYAML(document.getElementById('ta').value);document.getElementById('ta').value=JSON.stringify(obj,null,2)}catch(e){alert('YAML 解析失败')}
}
function j2y(){
  try{const obj=JSON.parse(document.getElementById('ta').value);document.getElementById('ta').value=toYAML(obj)}catch(e){alert('JSON 无效')}
}
</script>
