<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent 任务规划器 - 大目标拆解为可执行子任务</title>
<meta name="description" content="把模糊大目标拆解为依赖有序的可执行子任务，附每步 token 预算与总成本估算，帮助 Agent 自主规划不跑偏。">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0f1117;color:#e5e7eb;min-height:100vh;padding:24px}
.wrap{max-width:760px;margin:0 auto}h1{font-size:24px;margin-bottom:6px}h2{font-size:15px;color:#9ca3af;font-weight:400;margin-bottom:20px}
.card{background:#171a23;border:1px solid #2a2e3a;border-radius:12px;padding:20px;margin-bottom:16px}
label{display:block;font-size:13px;color:#9ca3af;margin-bottom:4px}textarea{width:100%;min-height:90px;padding:12px;border-radius:8px;border:1px solid #2a2e3a;background:#0f1117;color:#e5e7eb;font-size:14px;resize:vertical}
input{width:200px;padding:10px;border-radius:8px;border:1px solid #2a2e3a;background:#0f1117;color:#e5e7eb;font-size:14px}
button{width:100%;padding:12px;background:#2563eb;border:none;color:#fff;border-radius:8px;font-size:15px;cursor:pointer;margin-top:14px}
.out{background:#0b0d12;border:1px solid #2a2e3a;border-radius:8px;padding:14px;margin-top:12px;font-size:14px;white-space:pre-wrap;line-height:1.7}
.tag{display:inline-block;background:#1e293b;color:#60a5fa;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}.ok{color:#34d399}
</style>
</head>
<body>
<div class="wrap">
<h1>Agent 任务规划器 <span class="tag">原创 · Agent 自主规划</span></h1>
<h2>模糊大目标 → 依赖有序子任务 · 每步 token 预算 · 防跑偏/超预算</h2>
<div class="card">
<label>大目标</label><textarea id="goal" placeholder="例如：上线一个带用户系统的产品官网"></textarea>
<div class="row" style="display:flex;gap:12px;margin-top:10px;align-items:end">
<div><label>步骤数</label><input id="steps" type="number" value="6" min="3" max="10"></div>
<div><label>总 token 预算</label><input id="budget" type="number" value="100000" min="1000"></div>
<div><label>输入价 $/M</label><input id="ci" type="number" value="3" step="0.1"></div>
</div>
<button onclick="plan()">生成规划</button>
<div class="out" id="out">输入大目标后生成任务规划。</div>
</div>
</div>
<script>
function plan(){
  const goal=document.getElementById('goal').value.trim();const n=+document.getElementById('steps').value||6;const bud=+document.getElementById('budget').value||100000;const ci=+document.getElementById('ci').value||3;
  if(!goal){document.getElementById('out').innerHTML='请先输入大目标。';return}
  const tasks=[];
  for(let i=0;i<n;i++){const pct=Math.round((bud/(n*(n+1)/2))*(n-i));tasks.push(pct)}
  let h=`<b>目标：</b>${goal}\n\n<b>子任务（依赖有序，每步带预算）：</b>\n`;
  tasks.forEach((t,i)=>{h+=`${i+1}. 步骤${i+1}：${stepName(goal,i,n)}（预算 ${t.toLocaleString()} tokens，累计 ${tasks.slice(0,i+1).reduce((a,b)=>a+b,0).toLocaleString()}）\n`});
  const total=tasks.reduce((a,b)=>a+b,0);const cost=total/1e6*ci;
  h+=`\n<b>总预算：</b>${total.toLocaleString()} tokens（已用 ${bud?Math.round(total/bud*100):0}% 预算）\n<b>估算成本：</b>$${cost.toFixed(4)}（按输入 $${ci}/M）\n<b>建议：</b>若步骤超预算，先做步骤1-2（最高优先级），其余降级。`;
  document.getElementById('out').innerHTML=h;
  window._last={tool:'task-planner',input:{goal,steps:n,budget:bud},output:{tasks:tasks.map((t,i)=>({step:i+1,budget:t})),total_cost:cost}};
}
function stepName(g,i,n){
  const base=['明确范围与验收标准','收集信息与需求','设计核心方案','实现核心内容','验证与修复','交付与复盘'][i]||`推进步骤${i+1}`;
  return base;
}
(function(){const u=new URL(location.href);if(u.searchParams.get('format')==='json'){try{const d=JSON.parse(u.searchParams.get('input')||'{}');const goal=(d.goal||'').trim();if(!goal){document.body.textContent=JSON.stringify({tool:'task-planner',error:'goal required'});return}const n=+d.steps||6,bud=+d.budget||100000,ci=+d.ci||3;const tasks=[];for(let i=0;i<n;i++){const pct=Math.round((bud/(n*(n+1)/2))*(n-i));tasks.push(pct)}document.body.textContent=JSON.stringify({tool:'task-planner',input:d,output:{steps:tasks.map((t,i)=>({step:i+1,name:stepName(goal,i,n),budget:t})),total_budget:tasks.reduce((a,b)=>a+b,0)}})}catch(e){document.body.textContent=JSON.stringify({tool:'task-planner',error:'invalid input'})}}})();
</script>
</body>
</html>
