<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ipsum Forge - Lorem Ipsum生成器</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--acc:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
header{text-align:center;margin-bottom:20px}
header h1{font-size:24px;color:var(--acc)}
header p{color:var(--muted);font-size:13px;margin-top:4px}
.container{max-width:700px;margin:0 auto}
.controls{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.ctrl-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ctrl-row label{font-size:13px;color:var(--muted);white-space:nowrap}
.ctrl-row select,.ctrl-row input[type=number]{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:13px}
.ctrl-row input[type=number]{width:80px}
.btn{background:var(--acc);border:none;color:#0f172a;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--border);color:var(--text)}
.output-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.output-box h3{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between}
.output{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:'Segoe UI',sans-serif;font-size:14px;line-height:1.8;min-height:200px;max-height:400px;overflow:auto;white-space:pre-wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--acc);color:#0f172a;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header><h1>📝 Ipsum Forge</h1><p>Lorem Ipsum生成器 · 段落/句子/单词 · 中文/英文 · 纯前端</p></header>
<div class="container">
<div class="controls">
<div class="ctrl-row">
<label>类型</label>
<select id="type" onchange="generate()">
<option value="paragraphs">段落</option>
<option value="sentences">句子</option>
<option value="words">单词</option>
</select>
<label>数量</label>
<input type="number" id="count" value="5" min="1" max="100">
<label>语言</label>
<select id="lang" onchange="generate()">
<option value="en">English (Lorem Ipsum)</option>
<option value="zh">中文 (随机文本)</option>
</select>
<button class="btn" onclick="generate()">生成</button>
<button class="btn sec" onclick="copyOutput()">复制</button>
</div>
<div class="ctrl-row">
<label>开头用"Lorem ipsum"</label>
<input type="checkbox" id="classic" checked onchange="generate()">
</div>
</div>
<div class="output-box">
<h3>生成结果 <span style="font-size:11px" id="stats"></span></h3>
<div class="output" id="output"></div>
</div>
</div>
<div class="toast" id="toast">已复制!</div>
<script>
var enWords="lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum at vero eos accusamus iusto odio dignissimos ducimus blanditiis praesentium voluptatum deleniti atque corrupti quos quas molestias excepturi sint similique mollitia animi dolores".split(' ');
var zhWords="在一一个的人有了不是这中大为上来个我到要时也会这那就自己们与和以所然而但虽虽然因为所以如果即即使尽管不过然后因此此外另外同时最终终于实际上事实上简而言之总的来说换句话说换言之具体来说一般通常往往经常偶尔有时从来始终永远总是从不极少几乎很少常常时常不断持续继续开始结束完成实现达到获得得到产生形成成为变成变成保持维持支持帮助提供给予接受拒绝同意反对赞成认为觉得感觉发现发明创造创新改进完善优化提高降低增加减少扩大缩小加强削弱巩固破坏建设建立拆除组装拆卸连接断开结合分离合并分配共享公开隐藏保护暴露覆盖展开折叠旋转移动固定悬浮坠落升起降低推进后退左右前后内外上下东西南北中央周围附近远处近处局部全面整体部分全部某些许多少数几个".split('');

function randWord(lang){var w=lang==='zh'?zhWords:enWords;return w[Math.floor(Math.random()*w.length)];}
function randSentence(lang){
  var wc=8+Math.floor(Math.random()*12);
  var words=[];
  for(var i=0;i<wc;i++)words.push(randWord(lang));
  var s=words.join(lang==='zh'?'':' ');
  if(lang==='zh'){return s+'。';}else{return s.charAt(0).toUpperCase()+s.slice(1)+'.';}
}
function randParagraph(lang){
  var sc=3+Math.floor(Math.random()*4);
  var sens=[];
  for(var i=0;i<sc;i++)sens.push(randSentence(lang));
  return sens.join(lang==='zh'?'':' ');
}
function generate(){
  var type=document.getElementById('type').value;
  var count=Math.min(parseInt(document.getElementById('count').value)||5,100);
  var lang=document.getElementById('lang').value;
  var classic=document.getElementById('classic').checked;
  var result=[];
  for(var i=0;i<count;i++){
    if(type==='paragraphs'){
      var p=randParagraph(lang);
      if(i===0&&classic&&lang==='en'){p='Lorem ipsum dolor sit amet, consectetur adipiscing elit. '+p;}
      result.push(p);
    }else if(type==='sentences'){
      var s=randSentence(lang);
      if(i===0&&classic&&lang==='en'){s='Lorem ipsum dolor sit amet, consectetur adipiscing elit.';}
      result.push(s);
    }else{
      result.push(randWord(lang));
    }
  }
  var output=result.join(type==='paragraphs'?'\n\n':type==='sentences'?' ':' ');
  document.getElementById('output').textContent=output;
  var stats=output.split(/\s+/).filter(function(w){return w.length>0;}).length;
  document.getElementById('stats').textContent='('+stats+' '+(lang==='zh'?'字符':'words')+', '+result.length+' '+(type==='paragraphs'?'段':type==='sentences'?'句':'词')+')';
}
function copyOutput(){var t=document.getElementById('output').textContent;navigator.clipboard.writeText(t).then(function(){showToast('已复制!');});}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1500);}
generate();
</script>
</body>
</html>
