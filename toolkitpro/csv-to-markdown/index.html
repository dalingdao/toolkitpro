<script>
function parseCsv(s){
  var rows=[],row=[''],i=0,inQ=false;
  s=s.replace(/\r/g,'');
  while(i<s.length){
    var c=s[i];
    if(inQ){if(c==='"'){if(s[i+1]==='"'){row[row.length-1]+='"';i++;}else inQ=false;}else row[row.length-1]+=c;}
    else if(c==='"')inQ=true;
    else if(c===',')row.push('');
    else if(c==='\n'){rows.push(row);row=[''];}
    else row[row.length-1]+=c;
    i++;
  }
  rows.push(row);
  return rows.filter(function(r){return r.some(function(x){return x!==''})});
}
function csvToMd(s){
  var rows=parseCsv(s);
  if(!rows.length)return '(空)';
  var head=rows[0],out='| '+head.join(' | ')+' |\n| '+head.map(function(){return '---'}).join(' | ')+' |';
  for(var i=1;i<rows.length;i++)out+='\n| '+rows[i].join(' | ')+' |';
  return out;
}
function conv(){document.getElementById('out').value=csvToMd(document.getElementById('csv').value);}
conv();
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    var res={ok:true,markdown:csvToMd(q.get('csv')||'')};
    document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify(res,null,2)+'</pre>';
  }
})();
</script>
