<body>
<a class="back" href="/toolkitpro/">← 返回工具箱</a>
<div class="header">
  <h1>🧬 JSON Schema Generator</h1>
  <p>免费在线JSON转JSON Schema—— 自动生成。支持 ?input= &format=json 供 Agent 调用。</p>
  <div class="badges"><span class="badge">纯前端</span><span class="badge">JSON Schema</span><span class="badge">Agent可用</span></div>
</div>
<div class="container">
  <div class="card">
    <textarea id="json" placeholder='{"name":"Alice","age":30,"tags":["a","b"]}'>{"name":"Alice","age":30,"score":95.5,"active":true,"tags":["admin","user"],"address":{"city":"Beijing","zip":"100000"}}</textarea>
    <button class="btn" onclick="conv()">生成 Schema</button>
    <textarea id="out" style="margin-top:12px" placeholder="JSON Schema 输出"></textarea>
  </div>
</div>
<footer>ToolkitPro · JSON Schema Generator · 纯前端 · Agent可用</footer>
<script>
function typeOf(v){
  if(v===null)return {type:'null'};
  if(Array.isArray(v)){
    var inner=v.length?v[0]:null;
    return {type:'array',items:inner===null?{}:typeOf(inner)};
  }
  if(typeof v==='object')return {type:'object',properties:{},required:[]};
  var t=typeof v;
  if(t==='number')return Number.isInteger(v)?{type:'integer'}:{type:'number'};
  return {type:t};
}
function build(obj){
  var s=typeOf(obj);
  if(s.type==='object'){Object.keys(obj).forEach(function(k){s.properties[k]=build(obj[k]);s.required.push(k);});}
  return s;
}
function conv(){
  var el=document.getElementById('out');
  try{var o=JSON.parse(document.getElementById('json').value);el.value=JSON.stringify(build(o),null,2);}
  catch(e){el.value='（JSON 格式不正确）';}
}
conv();
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    try{var o=JSON.parse(q.get('input')||'');document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify({schema:build(o)},null,2)+'</pre>';}
    catch(e){document.body.innerHTML='<pre style="padding:30px">{"error":"invalid json"}</pre>';}
  }
})();
</script>
