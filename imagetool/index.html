<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor Pro - 免费在线图片压缩工具（纯前端）</title>
<meta name="description" content="免费在线图片压缩工具，支持 JPG/PNG/WebP，自定义质量与尺寸，压缩后直接下载，数据不出浏览器，无需注册。">
<meta name="keywords" content="图片压缩,image compressor,在线压缩,JPG压缩,PNG压缩,WebP,免费工具">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}
.header{text-align:center;padding:36px 20px 24px}
.header h1{font-size:28px;font-weight:800;color:#0f172a;margin-bottom:8px}
.header p{color:#64748b;font-size:14px;max-width:640px;margin:0 auto}
.badges{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#dcfce7;color:#166534}
.container{max-width:960px;margin:0 auto;padding:20px}
.drop{background:#fff;border:2px dashed #cbd5e1;border-radius:16px;padding:48px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.drag{border-color:#3b82f6;background:#eff6ff}
.drop .icon{font-size:44px;margin-bottom:12px}
.drop p{color:#64748b;font-size:14px}
.btn{background:#3b82f6;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:16px}
.btn:hover{background:#2563eb}
.controls{background:#fff;border-radius:12px;padding:20px;margin-top:16px;display:none}
.controls.show{display:block}
.row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px}
.field{flex:1;min-width:180px}
.field label{font-size:13px;color:#475569;display:block;margin-bottom:6px;font-weight:600}
input[type=range]{width:100%}
.result{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
.preview{flex:1;min-width:280px;background:#fff;border-radius:12px;padding:16px}
.preview h3{font-size:14px;color:#475569;margin-bottom:10px}
.preview img{max-width:100%;border-radius:8px;background:#f8fafc}
.info{font-size:13px;color:#64748b;margin-top:8px}
.info b{color:#0f172a}
.back{display:inline-block;margin:20px;font-size:13px;color:#64748b;text-decoration:none}
footer{text-align:center;padding:24px;color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<a class="back" href="/toolkitpro/">← 返回工具箱</a>
<div class="header">
  <h1>🖼️ Image Compressor Pro</h1>
  <p>免费在线图片压缩工具—— 支持 JPG/PNG/WebP，自定义质量与尺寸，数据不出浏览器，无需注册。</p>
  <div class="badges"><span class="badge">纯前端</span><span class="badge">隐私安全</span><span class="badge">即时下载</span></div>
</div>
<div class="container">
  <div class="drop" id="drop">
    <div class="icon">📁</div>
    <p>点击或拖拽图片到这里（JPG/PNG/WebP）</p>
    <input type="file" id="file" accept="image/*" style="display:none">
  </div>
  <div class="controls" id="controls">
    <div class="row">
      <div class="field">
        <label>压缩质量：<span id="qval">75%</span></label>
        <input type="range" id="quality" min="10" max="100" value="75">
      </div>
      <div class="field">
        <label>最大宽度（0=原始）：<span id="wval">1920</span></label>
        <input type="range" id="width" min="0" max="4000" value="1920" step="80">
      </div>
      <div class="field">
        <label>输出格式</label>
        <select id="format" style="width:100%;padding:8px;border-radius:8px;border:1px solid #cbd5e1">
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">WebP</option>
          <option value="image/png">PNG</option>
        </select>
      </div>
    </div>
    <div class="result" id="result"></div>
  </div>
</div>
<footer>ToolkitPro · Image Compressor Pro · 数据不出浏览器</footer>
<script>
const drop=document.getElementById('drop'),file=document.getElementById('file'),controls=document.getElementById('controls');
const quality=document.getElementById('quality'),qval=document.getElementById('qval'),width=document.getElementById('width'),wval=document.getElementById('wval'),format=document.getElementById('format');
let orig=null;
drop.addEventListener('click',()=>file.click());
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});
drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])});
file.addEventListener('change',()=>{if(file.files[0])load(file.files[0])});
quality.addEventListener('input',()=>{qval.textContent=quality.value+'%';compress()});
width.addEventListener('input',()=>{wval.textContent=width.value;compress()});
format.addEventListener('change',compress);
function load(f){
  const r=new FileReader();
  r.onload=e=>{orig=new Image();orig.onload=compress;orig.src=e.target.result};
  r.readAsDataURL(f);
}
function compress(){
  if(!orig)return;
  const maxW=parseInt(width.value);
  let w=orig.naturalWidth,h=orig.naturalHeight;
  if(maxW>0&&w>maxW){h=Math.round(h*maxW/w);w=maxW}
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(orig,0,0,w,h);
  const q=parseInt(quality.value)/100;
  const data=c.toDataURL(format.value,q);
  const kb=Math.round(data.length*0.75/1024);
  const okb=Math.round((orig.src.length||0)*0.75/1024);
  document.getElementById('result').innerHTML=
    '<div class="preview"><h3>压缩结果</h3><img src="'+data+'"><div class="info">'+w+'×'+h+' · <b>'+kb+' KB</b>'+(okb?'（原始约 '+okb+' KB，节省 '+Math.max(0,Math.round((1-kb/okb)*100))+'%）':'')+'</div><button class="btn" onclick="dl()">⬇ 下载压缩图</button></div>';
  window._data=data;
}
function dl(){const a=document.createElement('a');a.href=window._data;a.download='compressed-'+Date.now()+'.'+(format.value.split('/')[1]);a.click()}
</script>
</body>
</html>
