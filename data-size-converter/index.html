<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}

<body>
<a class="back" href="/toolkitpro/">鈫?杩斿洖宸ュ叿绠?/a>
<div class="header">
  <h1>馃捑 Data Size Converter</h1>
  <p>鍏嶈垂鍦ㄧ嚎鏁版嵁澶у皬鎹㈢畻鈥斺€?B/KB/MB/GB/TB锛?KB=1024B锛夈€?/p>
  <div class="badges"><span class="badge">绾墠绔?/span><span class="badge">瀛樺偍</span><span class="badge">鎹㈢畻</span></div>
</div>
<div class="container">
  <div class="card">
    <div class="field"><label>鏁板€?/label><input type="number" id="v" value="1024" min="0" oninput="calc()"></div>
    <div class="field"><label>鍗曚綅</label><select id="u" onchange="calc()">
      <option value="B">B</option><option value="KB" selected>KB</option><option value="MB">MB</option><option value="GB">GB</option><option value="TB">TB</option>
    </select></div>
    <div class="result" id="res"></div>
  </div>
</div>
<footer>ToolkitPro 路 Data Size Converter 路 绾墠绔?/footer>
<script>
var P={B:0,KB:1,MB:2,GB:3,TB:4};
function calc(){
  var v=+document.getElementById('v').value||0,u=document.getElementById('u').value;
  var bytes=v*Math.pow(1024,P[u]);
  var rows=Object.keys(P).map(function(k){var val=bytes/Math.pow(1024,P[k]);return '<div class="row"><span>'+k+'</span><b>'+val.toLocaleString('en-US',{maximumFractionDigits:6})+'</b></div>';}).join('');
  document.getElementById('res').innerHTML=rows;
}
calc();
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    var v=+q.get('value')||0,u=q.get('unit')||'KB',bytes=v*Math.pow(1024,P[u]);
    var out={bytes:bytes};Object.keys(P).forEach(function(k){out[k]=bytes/Math.pow(1024,P[k]);});
    document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify(out,null,2)+'</pre>';
  }
})();
</script>
