<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affirmation Generator - 免费在线每日肯定语</title>
<meta name="description" content="免费在线肯定语生成器，随机正面肯定语，纯前端，无需注册，支持URL参数供AI Agent调用。">
<meta name="keywords" content="肯定语,affirmation,积极,自我肯定,激励,免费工具">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{text-align:center;padding:36px 20px 24px}
.header h1{font-size:28px;font-weight:800;margin-bottom:8px}
.header p{color:#e0e7ff;font-size:14px}
.badges{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(255,255,255,0.2)}
.quote{max-width:560px;margin:20px;padding:30px;background:rgba(255,255,255,0.15);border-radius:16px;text-align:center;font-size:22px;line-height:1.8;font-weight:500}
.ctrl button{padding:12px 28px;border-radius:24px;border:none;cursor:pointer;font-size:16px;font-weight:600;background:#fff;color:#4c1d95}
.back{display:inline-block;margin:20px;font-size:13px;color:#e0e7ff;text-decoration:none}
</style>
</head>
<body>
<a class="back" href="/toolkitpro/">← 返回工具箱</a>
<div class="header">
  <h1>✨ Affirmation</h1>
  <p>每日肯定语—— 用积极的自我对话开启一天。</p>
  <div class="badges"><span class="badge">纯前端</span><span class="badge">积极</span><span class="badge">Agent可用</span></div>
</div>
<div class="quote" id="q"></div>
<div class="ctrl"><button onclick="pick()">换一句</button></div>
<script>
var A=[
'我是有能力且值得被爱的。','我今天的每一步都在变得更好。','我选择把注意力放在我能控制的事情上。','我的价值不取决于别人的看法。','我允许自己慢慢来，也在持续进步。','我有力量创造我想要的生活。','每一次挑战都是我成长的机会。','我值得拥有幸福和成功。','我的身体是强大的，我善待它。','我可以平静面对不确定性。','我正在成为我想成为的人。','我的努力正在慢慢开花结果。'];
function pick(){document.getElementById('q').textContent='“'+A[Math.floor(Math.random()*A.length)]+'”';}
pick();
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){document.body.innerHTML='<pre style="padding:30px;font-size:15px">'+JSON.stringify({affirmation:A[Math.floor(Math.random()*A.length)]},null,2)+'</pre>';}
})();
</script>
</body>
</html>
