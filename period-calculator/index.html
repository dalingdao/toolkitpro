<script>
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function calc(){
  var dv=document.getElementById('d').value,c=+document.getElementById('c').value||28;
  var el=document.getElementById('res');
  if(!dv){el.innerHTML='<div class="big">閫夋嫨鏈鏈堢粡鏃ユ湡</div>';return;}
  var start=new Date(dv),next=new Date(start.getTime()+c*86400000),next2=new Date(start.getTime()+2*c*86400000);
  var ov=new Date(start.getTime()+(c-14)*86400000);
  var fert1=new Date(ov.getTime()-5*86400000),fert2=new Date(ov.getTime()+1*86400000);
  el.innerHTML='<div class="big">涓嬫鏈堢粡 '+fmt(next)+'<br>鍐嶄笅娆?'+fmt(next2)+'<br>鎺掑嵉鏃?'+fmt(ov)+'</div><div class="sub">鏄撳瓡鏈?'+fmt(fert1)+' ~ '+fmt(fert2)+'</div>';
}
calc();
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('format')==='json'){
    var d=q.get('date')||new Date().toISOString().slice(0,10),c=+q.get('cycle')||28,start=new Date(d);
